  /* 블록 삭제 — 고른 블록을 지우는 자리가 여기 말고는 없다(선택 삭제 모드는 여러 개용).
     캐릭터·테마 삭제와 같은 2단계 확인을 쓴다. */
  const delRow = () => {
    const l = el('div', 'tool-line');
    /* 복제 — 같은 말풍선을 발화자만 바꿔 쓰거나, 서식을 잡아 둔 블록을 본으로 삼는 일이 잦다.
       바로 아래에 꽂고 그 블록을 편집 대상으로 옮겨 준다. */
    const dup = el('button', 'btn btn-quiet', '블록 복제');
    dup.style.cssText = 'flex:1;height:38px';
    dup.onclick = () => {
      const copy = Object.assign({}, b, { id: uid() });
      S.blocks.splice(S.blocks.indexOf(b) + 1, 0, copy);
      S.ui.selectedBlockId = copy.id;
      $('#ta').value = HAS_TEXT.includes(copy.type) ? (copy.text || '') : '';
      save(); render(); autoGrow(); toast('블록을 복제했습니다');
    };
    l.appendChild(dup);
    const del = dangerBtn('블록 삭제', 'blk:' + b.id, () => {
      S.blocks = S.blocks.filter(x => x.id !== b.id);
      save(); setStage('composer'); toast('블록을 삭제했습니다');
    });
    /* .btn-danger 는 혼자 쓰라고 width:100% 다 — 둘이 나란히 서는 자리에서는 반씩 나눈다 */
    del.style.cssText = 'flex:1;width:auto;height:38px';
    l.appendChild(del);
    return l;
  };

  /* 글자가 없는 블록에는 글자 서식을 띄우지 않는다 */
  const isText = !b || b.type === 'text' || b.type === 'footer';
  /* 사진은 글자 서식이 없다 — 자르기 편집기와 복제·삭제만 둔다 */
  if (b && b.type === 'image') {
    const host = el('div', 'sec');
    buildImageEditor(host, b);
    wrap.append(host, delRow());
    return;
  }
  /* 서명은 두 칸을 먼저 두고, 그 아래에 글자 서식(글꼴·정렬·서식)을 이어 붙인다.
     한 블록의 일을 한 패널에서 끝낸다 — 예전처럼 취소를 눌러야 서식이 보이지 않는다. */
  if (b && b.type === 'footer') {
    const host = el('div', 'sec');
    buildFooterEditor(host, b);
    /* 위는 '무엇을 적는가', 아래는 '어떻게 보이는가' — 성격이 갈리므로 선으로 끊는다 */
    host.appendChild(el('div', 'divider'));
    wrap.appendChild(host);
  } else if (!isText) {
    wrap.appendChild(delRow());
    return;
  }

  /* 줄 순서는 '이 블록이 무엇인가' → '어떻게 보이는가' 순이다.
     글꼴과 말풍선 여부가 블록의 성격을 정하고, 정렬·색·서식·주석은 그 안의 꾸밈이다.
       글꼴
       말풍선으로 출력
       정렬 / 색 지정
       서식 / 주석                                            */

  /* 정렬 · 색 지정 */
  const l1 = el('div', 'tool-line');
  const g1 = el('div', 'tool-grp'); g1.appendChild(el('span', 'lab', '정렬'));
  Object.keys(ALIGN_ICON).forEach(k => {
    const cur = b ? (b.align || g.align) : g.align;
    const btn = el('button', 'icb' + (cur === k ? ' is-on' : ''));
    btn.title = ALIGN_NAME[k];
    btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="${ALIGN_ICON[k]}"/></svg>`;
    btn.onclick = () => { if (b) b.align = k; else { g.align = k; clearBlockOwn('align', '글 정렬'); } save(); render(); };
    g1.appendChild(btn);
  });
  const g2 = el('div', 'tool-grp'); g2.appendChild(el('span', 'lab', '색 지정'));
  g2.appendChild(colorBtn('A', S.colors.text, '글자 색', v => {
    if (v == null) {                       /* 기본값 — 테마의 글자색을 그대로 따라간다 */
      if (hasSel()) { clearRich('color'); if (b) b.text = $('#ta').value; }
      else if (b) delete b.color;
    } else {
      S.colors.text = v;
      if (hasSel()) { applyRich('color', v); if (b) b.text = $('#ta').value; }
      else if (b) b.color = v;
      else clearBlockOwn('color', '글자색');   /* 고른 블록이 없으면 전체를 고치는 중이다 */
    }
    save(); render();
  }, true));
  g2.appendChild(colorBtn('✏️', S.colors.highlight, '형광펜', v => {
    /* 형광펜은 블록 단위 값이 없다. 선택이 없으면 글 전체에 건다. */
    if (v == null) clearRich('mark');
    else { S.colors.highlight = v; applyRich('mark', v); }
    if (b) b.text = $('#ta').value;
    save(); render();
  }, true));
  l1.append(g1, el('div', 'tool-sep'), g2);

  /* 글 서식 · 주석 */
  const l2 = el('div', 'tool-line');
  const g3 = el('div', 'tool-grp'); g3.appendChild(el('span', 'lab', '서식'));
  [['bold', 'B'], ['italic', 'I'], ['underline', 'U'], ['strike', 'S']].forEach(([k, t]) => {
    const btn = el('button', 'icb' + (b && !hasSel() && b[k] ? ' is-on' : ''), t);
    if (k === 'bold') btn.style.fontWeight = 700;
    if (k === 'italic') btn.style.fontStyle = 'italic';
    if (k === 'underline') btn.style.textDecoration = 'underline';
    if (k === 'strike') btn.style.textDecoration = 'line-through';
    btn.disabled = !b;
    /* 선택 영역이 있으면 그 부분만 · 없으면 블록 전체 */
    btn.onmousedown = e => e.preventDefault();   /* 마우스만 — touchstart 를 막으면 클릭 자체가 사라진다 */
    btn.onclick = () => {
      if (!b) return;
      if (hasSel()) { applyRich(k); b.text = $('#ta').value; }
      else b[k] = !b[k];
      save(); render();
    };
    g3.appendChild(btn);
  });

  /* 주석 — 아예 안 고르거나 둘 중 하나 (배타) */
  const g4 = el('div', 'tool-grp'); g4.appendChild(el('span', 'lab', '주석'));
  [['윗주석', 'sup'], ['아랫주석', 'sub']].forEach(([title, tag], i) => {
    const btn = el('button', 'icb' + (b && b.ann === i + 1 && !hasSel() ? ' is-on' : ''));
    btn.innerHTML = `<span class="ann">A<${tag}>2</${tag}></span>`;
    btn.title = title;
    btn.disabled = !b;
    btn.onmousedown = e => e.preventDefault();
    btn.onclick = () => {
      if (!b) return;
      if (hasSel()) { applyRich(i === 0 ? 'sup' : 'sub'); b.text = $('#ta').value; }
      else b.ann = b.ann === i + 1 ? 0 : i + 1;   /* 안 고르거나 둘 중 하나 */
      save(); render();
    };
    g4.appendChild(btn);
  });
  /* 서명에 윗주석·아랫주석을 달 일은 없다 — 이름 한 줄이다. 글꼴·정렬·서식·색만 남긴다. */
  if (b && b.type === 'footer') l2.appendChild(g3);
  else l2.append(g3, el('div', 'tool-sep'), g4);

  /* 이 시트는 '고른 블록 하나' 를 고친다. 도구 › 서식 설정은 '전체 기본값' 이다.
     여기서 한 번이라도 건드린 항목은 그 블록의 값이 되어, 그 뒤로 전체 설정을 바꿔도
     이 블록만 따라오지 않는다 — 넓은 화면에서 둘이 나란히 떠 있으면 그게
     '일부만 적용되는 고장' 처럼 보인다. 무엇이 걸려 있는지 적고, 한 번에 풀 수 있게 둔다. */
  /* 글꼴 — 고르는 칸이 넓어야 이름이 안 잘린다. 한 줄을 통째로 준다. */
  const l3 = el('div', 'tool-line');
  const g5 = el('div', 'tool-grp'); g5.style.flex = '1';
  g5.appendChild(el('span', 'lab', '글꼴'));
  g5.appendChild(fontSelect(b ? (b.font || g.font) : g.font,
    v => { if (b) b.font = v; else { g.font = v; clearBlockOwn('font', '글꼴'); } save(); render(); }));
  l3.appendChild(g5);
  wrap.appendChild(l3);

  /* 말풍선으로 출력 — 이 하나로 블록의 성격이 바뀌므로(발화자 줄이 따라 열린다) 따로 세운다 */
  if (b && b.type === 'text') {
    const l3b = el('div', 'tool-line');
    const g6 = el('div', 'tool-grp'); g6.style.flex = '1';
    g6.appendChild(el('span', 'lab', '말풍선으로 출력'));
    const t = el('button', 'tgl' + (b.asBubble ? ' is-on' : ''));
    t.style.marginLeft = 'auto';
    t.onclick = () => { b.asBubble = !b.asBubble; if (!b.asBubble) b.speakerId = null; save(); render(); };
    g6.appendChild(t);
    l3b.appendChild(g6);
    wrap.appendChild(l3b);
  }
  /* 발화자 지정 (SCR-WEB-023) — '말풍선으로 출력' 을 켜야 나타난다. 그 바로 아래에 둔다. */
  if (b && b.asBubble) {
    const l4 = el('div', 'tool-line');
    const row = el('div', 'av-row');
    S.characters.forEach(c => {
      const a = el('button', 'av-chip' + (b.speakerId === c.id ? ' is-on' : ''));
      if (c.avatar) { const i = el('img'); i.src = c.avatar; a.appendChild(i); } else a.innerHTML = initialSvg(c.name);
      a.title = c.name;
      a.onclick = () => { b.speakerId = b.speakerId === c.id ? null : c.id; save(); render(); };
      row.appendChild(a);
    });
    const add = el('button', 'av-chip is-add');
    add.innerHTML = PLUS_SVG;
    add.title = '캐릭터 추가';
    add.onclick = () => { S.ui.tool = 'character'; S.ui.editingCharacterId = 'new'; S.ui.charDraft = null; setStage('tools'); };
    row.appendChild(add);
    l4.appendChild(row); wrap.appendChild(l4);
  }

  wrap.append(l1, l2);

  if (b) wrap.appendChild(delRow());
}

/* ═══ 선택 삭제 [원본 bulk-delete-mode] ═══════════════════════ */
function toggleBulk(on) {
  S.ui.bulk = on;
  S.ui.picked = new Set();
  /* NAV 에서 시작한 일이지만 NAV 안에서 이어지지는 않는다 — 칩을 접고 그 자리를 내준다.
     열어 둔 채로 두면 '삽입 메뉴' 와 '지울 것 고르기' 가 한 화면에 겹쳐 뜬다. */
  if (on) { endEdit(); S.ui.insertMode = null; S.ui.navOpen = false; }
  render();
}
/* NAV 가 있던 그 한 칸에 그대로 선다 [.nav-slot] — 눌러서 들어온 자리에서 이어진다. */
function renderBulkBar() {
  const row = $('#bulkRow'), nav = $('#navRow');
  row.innerHTML = '';
  row.hidden = !S.ui.bulk;
  nav.hidden = !!S.ui.bulk;
  if (!S.ui.bulk) return;
  const bar = row;
  const n = S.ui.picked ? S.ui.picked.size : 0;
  const all = el('button', 'btn btn-quiet', n === S.blocks.length ? '전체 해제' : '전체 선택');
  all.onclick = () => {
    S.ui.picked = n === S.blocks.length ? new Set() : new Set(S.blocks.map(b => b.id));
    render();
  };
  const del = el('button', 'btn btn-danger', n ? `${n}개 삭제` : '0개 선택');
  del.disabled = !n; del.style.opacity = n ? 1 : .5;
  del.onclick = () => {
    if (!n) return;
    S.blocks = S.blocks.filter(b => !S.ui.picked.has(b.id));
    S.ui.bulk = false; S.ui.picked = new Set();
    save(); toast(`${n}개를 삭제했습니다`);
    backToDefault();          /* 지웠으면 끝난 일이다 */
  };
  const cancel = el('button', 'btn btn-quiet', '취소');
  cancel.style.flex = '0 0 auto';
  cancel.onclick = () => { S.ui.bulk = false; S.ui.picked = new Set(); backToDefault(); };
  bar.append(all, del, cancel);
}

function fontSelect(cur, on) {
  const s = el('select', 'sel');
  let group = null, box = null;
  FONTS.forEach(f => {
    if (f.g !== group) { group = f.g; box = document.createElement('optgroup'); box.label = f.g; s.appendChild(box); }
    /* 함께 들고 다니는 글꼴은 file:// 로 열면 브라우저가 CORS 로 막아 아예 안 뜬다.
       고르고 나서야 아무 일도 안 일어나는 것보다 목록에서 미리 알려 주는 편이 낫다. */
    const o = el('option', '', f.label + (IS_FILE && f.local ? ' (서버 필요)' : ''));
    o.value = f.name;
    if (cur === f.name) o.selected = true;
    box.appendChild(o);
  });
  s.onchange = () => {
    /* 글꼴이 붙기 전에 그리면 대체 글꼴로 한 번 그려졌다가 튄다. 받아 놓고 반영한다. */
    ensureFontCss(s.value).then(() => on(s.value));
    on(s.value);
    if (IS_FILE && fontOf(s.value).local) toast('이 글꼴은 서버로 띄워야 보입니다 · ./serve.sh');
  };
  return s;
}

/* ═══ 색 지정 팝오버 [원본 setPartialColor 를 팝오버로] ═══════ */
/* [원본 PALETTE_BASE] 기본 9색은 고정 · 사용자가 더한 색은 뒤에 붙어 브라우저에 남는다 */
const PALETTE_BASE = ['#424448', '#FFFFFF', '#8A8F98', '#D14343', '#E08A3C',
  '#E3B93C', '#4C9A5A', '#4A7FD1', '#8A5FD1'];
const PALETTE_KEY = 'chat-excerpt/palette';
let userPalette = [];
const loadPalette = () => { try { userPalette = JSON.parse(localStorage.getItem(PALETTE_KEY) || '[]'); } catch (e) { userPalette = []; } };
const savePalette = () => { try { localStorage.setItem(PALETTE_KEY, JSON.stringify(userPalette)); } catch (e) { } };
const isUserColor = h => userPalette.includes(h.toUpperCase());
/* [원본 EYEDROPPER_SVG] */
const EYEDROPPER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '
  + 'stroke-linecap="round" stroke-linejoin="round"><path d="M19 3a2.8 2.8 0 0 1 0 4l-1.5 1.5-3-3L16 4a2.8 2.8 0 0 1 3-1z"/>'
  + '<path d="M14.5 8.5 5 18v3h3l9.5-9.5"/></svg>';

function colorBtn(label, val, title, onPick, clearable) {
  const b = el('button', 'icb is-tint', label);
  b.title = `${title} — ${val}`;
  b.style.setProperty('--tint', val);        /* 원 둘레 링으로 지금 색을 보여준다 */
  b.onmousedown = e => e.preventDefault();   /* 마우스만 */
  b.onclick = () => openColorPop(b, val, title, onPick, clearable);
  return b;
}

function closePop() { $('#popRoot').innerHTML = ''; }

function openColorPop(anchor, cur, title, onPick, clearable) {
  closePop();
  const root = $('#popRoot');
  const mask = el('div', 'popmask'); mask.onclick = closePop;
  const pop = el('div', 'pop');
  root.append(mask, pop);

  const commit = c => {
    if (c == null) { closePop(); onPick(null); return; }   /* 기본값으로 되돌리기 */
    c = c.toUpperCase();
    S.colors.recent = [c, ...(S.colors.recent || []).filter(x => x !== c)].slice(0, 6);
    closePop(); onPick(c);
  };

  /* ── 1단계: 프리셋 팔레트 [원본 palettePop]
        자주 쓰는 색은 여기서 점 하나로 끝내고, 그 밖의 색만 스포이드로 넘어간다. */
  function stage1() {
    pop.innerHTML = '';
    pop.appendChild(el('div', 'pop-title', title + (hasSel() ? ' — 선택한 부분' : ' — 블록 전체')));
    const grid = el('div', 'pop-grid');
    if (clearable) {
      /* 지정한 색을 지우고 테마의 글자색을 그대로 따라가게 한다 */
      const none = el('button', 'pop-sw none');
      none.title = '기본값 — 지정한 색 지우기';
      none.onclick = () => commit(null);
      grid.appendChild(none);
    }
    const list = [...PALETTE_BASE, ...userPalette];
    list.forEach(c => {
      const sw = el('button', 'pop-sw' + (c.toUpperCase() === (cur || '').toUpperCase() ? ' is-on' : ''));
      sw.style.background = c;
      sw.title = c + (isUserColor(c) ? ' — 길게 누르면 팔레트에서 지웁니다' : '');
      sw.onclick = () => commit(c);
      /* 사용자가 더한 색만 지운다. 기본 9색은 그대로 둔다. [원본 contextmenu] */
      if (isUserColor(c)) {
        const rm = () => {
          userPalette = userPalette.filter(x => x !== c.toUpperCase());
          savePalette(); stage1();
        };
        sw.oncontextmenu = e => { e.preventDefault(); rm(); };
        let t; sw.onpointerdown = () => { t = setTimeout(rm, 550); };
        sw.onpointerup = sw.onpointerleave = () => clearTimeout(t);
      }
      grid.appendChild(sw);
    });
    /* 팔레트에 색 더하기 */
    const add = el('button', 'pop-sw pop-add', '＋');
    add.title = '팔레트에 색 추가';
    add.onclick = () => stage2(true);
    grid.appendChild(add);
    pop.appendChild(grid);

    const pick = el('button', 'btn btn-quiet pop-pick');
    pick.innerHTML = EYEDROPPER + '<span>색 직접 고르기</span>';
    pick.onclick = () => stage2(false);
    pop.appendChild(pick);
    place();
  }

  /* ── 2단계: HSV 피커 — 채도·명도 사각 + 색상 띠 [원본 openPicker] */
  function stage2(addMode) {
    pop.innerHTML = '';
    const hsv = hexToHsv(cur || '#424448');
    pop.appendChild(el('div', 'pop-title', addMode ? '팔레트에 더할 색' : title));

    const sv = el('div', 'pop-sv');
    const dot = el('i'); sv.appendChild(dot);
    const hue = el('div', 'pop-hue');
    const hdot = el('i'); hue.appendChild(hdot);
    pop.append(sv, hue);

    const foot = el('div', 'pop-foot');
    const swBox = el('div', 'pop-cur');
    const hex = el('input', 'inp'); hex.style.cssText = 'flex:1;min-width:0';
    const okb = el('button', 'btn btn-primary', addMode ? '추가' : '적용');
    foot.append(swBox, hex, okb); pop.appendChild(foot);

    const back = el('button', 'btn btn-quiet', '← 팔레트');
    back.style.cssText = 'width:100%;height:30px;margin-top:8px';
    back.onclick = stage1;
    pop.appendChild(back);

    const paint = () => {
      const v = hsvToHex(hsv.h, hsv.s, hsv.v);
      hex.value = v; swBox.style.background = v;
      sv.style.background =
        `linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsvToHex(hsv.h, 100, 100)})`;
      dot.style.left = hsv.s + '%'; dot.style.top = (100 - hsv.v) + '%';
      dot.style.background = v;
      hdot.style.left = (hsv.h / 360 * 100) + '%';
    };
    const drag = (node, fn) => {
      const move = e => {
        const r = node.getBoundingClientRect();
        fn(clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1));
        paint();
      };
      node.addEventListener('pointerdown', e => {
        e.preventDefault(); try { node.setPointerCapture(e.pointerId); } catch (_) { }
        node._on = true; move(e);
      });
      node.addEventListener('pointermove', e => { if (node._on) move(e); });
      const up = () => { node._on = false; };
      node.addEventListener('pointerup', up); node.addEventListener('pointercancel', up);
    };
    drag(sv, (x, y) => { hsv.s = x * 100; hsv.v = (1 - y) * 100; });
    drag(hue, x => { hsv.h = x * 360; });
    hex.oninput = () => {
      if (!/^#[0-9a-f]{6}$/i.test(hex.value)) return;
      Object.assign(hsv, hexToHsv(hex.value)); paint();
    };
    okb.onclick = () => {
      const v = hsvToHex(hsv.h, hsv.s, hsv.v);
      if (addMode) {
        if (!isUserColor(v) && !PALETTE_BASE.includes(v)) { userPalette.push(v); savePalette(); }
        stage1();
      } else commit(v);
    };
    paint(); place();
  }

  function place() {
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth || 250, h = pop.offsetHeight || 240;
    pop.style.left = clamp(r.left + r.width / 2 - w / 2, 10, window.innerWidth - w - 10) + 'px';
    pop.style.top = (r.top - h - 10 > 10 ? r.top - h - 10 : Math.min(r.bottom + 10, window.innerHeight - h - 10)) + 'px';
  }
  stage1();
}

/* ═══ 모달 ═══════════════════════════════════════════════════ */
function closeModal() { $('#modalRoot').innerHTML = ''; }

function modal(title, sub) {
  closeModal();
  const root = $('#modalRoot');
  const m = el('div', 'modal');
  m.onclick = e => { if (e.target === m) closeModal(); };
  const p = el('div', 'modal-panel');

/* 자르기 틀 [원본 msgCropState / clampMsgCrop / onMsgCropZoom] */
const arOf = r => { const q = String(r || 1).split(':').map(Number); return (q[1] ? q[0] / q[1] : q[0]) || 1; };

function cropField(src, ratio) {
  const box = el('div', 'crop');
  /* 비율은 CSS 변수로도 내려 준다 — 높이 제한(max-width)이 이 값을 곱해 쓴다 */
  const setAR = r => { box.style.aspectRatio = String(r).replace(':', '/'); box.style.setProperty('--ar', arOf(r)); };
  setAR(ratio || 1);
  const st = { scale: 1, x: 0, y: 0, natW: 0, natH: 0, drag: false, pid: null, base: 1, touched: false };
  let img = null, grid = null;

  const apply = () => { if (img) img.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.scale})`; };
  const clampPos = () => {
    const fw = box.clientWidth, fh = box.clientHeight;
    const w = st.natW * st.scale, h = st.natH * st.scale;
    st.x = w <= fw ? (fw - w) / 2 : clamp(st.x, fw - w, 0);
    st.y = h <= fh ? (fh - h) / 2 : clamp(st.y, fh - h, 0);
  };
  const refit = () => {
    if (!img || !st.natW) return;
    const fw = box.clientWidth, fh = box.clientHeight;
    /* 아직 배치 전이면 0 이 나온다. 다음 프레임에 다시 잰다 — 0 으로 잡으면 배율이 0 이 되어 아무것도 안 보인다. */
    if (!fw || !fh) { requestAnimationFrame(refit); return; }
    st.base = Math.max(fw / st.natW, fh / st.natH);   /* 틀을 꽉 채우는 배율이 최소값 */
    st.scale = st.base; st.x = 0; st.y = 0;
    clampPos(); apply();
    if (box._onScale) box._onScale(st.base);
  };
  const setSrc = s => {
    box.innerHTML = '';
    box._src = s || '';
    if (!s) { box.appendChild(el('div', 'crop-empty', '이미지를 선택하세요')); img = null; return; }
    img = el('img'); img.src = s;
    img.onload = () => {
      st.natW = img.naturalWidth; st.natH = img.naturalHeight;
      img.style.width = st.natW + 'px'; img.style.height = st.natH + 'px';
      refit();
    };
    if (img.complete && img.naturalWidth) img.onload();
    grid = el('div', 'crop-grid');
    box.append(img, grid);
  };
  /* [원본 setMsgCropRatio] 비율을 바꾸면 틀만 바뀌고 이미지는 다시 꽉 차게 맞춘다 */
  box._setRatio = r => { setAR(r); requestAnimationFrame(refit); };

  box.addEventListener('pointerdown', e => {
    if (!img) return;
    e.preventDefault(); st.drag = true; st.pid = e.pointerId;
    st.sx = e.clientX; st.sy = e.clientY; st.ox = st.x; st.oy = st.y;
    box.classList.add('grab');
    try { box.setPointerCapture(e.pointerId); } catch (_) { }
  });
  box.addEventListener('pointermove', e => {
    if (!st.drag || e.pointerId !== st.pid) return;
    e.preventDefault();
    st.touched = true;
    st.x = st.ox + (e.clientX - st.sx); st.y = st.oy + (e.clientY - st.sy);
    clampPos(); apply();
  });
  const end = e => {
    if (!st.drag || (e && e.pointerId !== st.pid)) return;
    st.drag = false; st.pid = null; box.classList.remove('grab');
  };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);

  /* 틀 한가운데를 기준으로 확대해야 보고 있던 지점이 그대로 남는다 [원본] */
  box._zoom = next => {
    st.touched = true;
    const prev = st.scale, cx = box.clientWidth / 2, cy = box.clientHeight / 2, k = next / prev;
    st.x = cx - (cx - st.x) * k; st.y = cy - (cy - st.y) * k;
    st.scale = next; clampPos(); apply();
  };
  box._state = st;
  box._setSrc = setSrc;
  /* 창에 떨군 사진을 이 틀이 받는다 — 받은 뒤 무엇을 더 할지는 모달이 정한다(_onPick) */
  box._dropFile = f => readImageFile(f, d => { setSrc(d); if (box._onPick) box._onPick(d); });
  box._maxPx = 1024;                 /* 구워 낼 최대 변 길이 — 캐릭터 이미지는 더 작게 잡는다 */
  box._export = () => {
    if (!img || !st.natW) return box._src || null;
    const fw = box.clientWidth, fh = box.clientHeight;
    /* 옮기지도 확대하지도 않았으면 다시 구울 이유가 없다 — 원본을 그대로 쓴다 */
    if (!st.touched || !fw || !fh) return box._src || null;
    try {
      const out = document.createElement('canvas');
      const R = Math.min(2, box._maxPx / Math.max(fw, fh));
      out.width = Math.round(fw * R); out.height = Math.round(fh * R);
      const g = out.getContext('2d');
      if (!g) return box._src || null;
      g.setTransform(R, 0, 0, R, 0, 0);
      g.drawImage(img, st.x, st.y, st.natW * st.scale, st.natH * st.scale);
      return encodeCanvas(out);
    } catch (e) { console.warn('crop export 실패 — 원본 사용', e); return box._src || null; }
  };
  setSrc(src);
  return box;
}

/* ═══ 제작자 서명 ═══════════════════════════════════════════
   서명은 거의 언제나 '누구의 이야기인가 · 누가 만들었나' 두 조각으로 적힌다.
   한 줄로 받으면 가운뎃점을 사람이 매번 손으로 찍어야 하고, 한쪽만 쓸 때
   점이 남거나 빠지는 것도 사람 몫이 된다. 칸을 둘로 나누고 잇는 일은 여기서 한다. */
const FOOTER_SEP = ' · ';
function footerText(b) {
  const parts = [b.charName, b.maker].map(x => (x || '').trim()).filter(Boolean);
  if (parts.length) return parts.join(FOOTER_SEP);
  return b.text || '';        /* 한 줄로만 적던 시절의 저장본 */
}

/* 서명 편집 — 칸이 둘뿐이라 확정 단추를 둘 이유가 없다. 적는 대로 캔버스에 반영된다.
   그만두려면 위 [×] 로 블록에서 손을 떼면 되고, 지우려면 아래 [블록 삭제] 다. */
function buildFooterEditor(host, block) {
  host.appendChild(el('div', 'sec-lab', '서명'));
  const guide = el('p', 'modal-sub',
    `캔버스 맨 아래에 «캐릭터${FOOTER_SEP}제작자» 로 들어갑니다. 한쪽만 적으면 그 한쪽만 나옵니다.`);
  guide.style.margin = '0 0 12px';
  host.appendChild(guide);

  /* 예전 한 줄짜리 서명은 '제작자' 로 옮겨 놓고 시작한다 — 지우고 다시 쓰게 하지 않는다 */
  if (!block.charName && !block.maker && block.text) { block.maker = block.text; block.text = ''; }

  const body = el('div', 'stack');
  const mk = (label, key, ph) => {
    const w = el('div');
    w.appendChild(el('span', 'lab', label));
    const i = el('input', 'inp'); i.value = block[key] || ''; i.placeholder = ph;
    i.oninput = () => { block[key] = i.value; save(); renderCanvas(); };
    w.appendChild(i);
    return w;
  };
  body.append(mk('캐릭터', 'charName', '예) 홍길동'), mk('제작자', 'maker', '예) @아이디'));
  host.appendChild(body);
}

/* 이미지 편집 — 예전엔 창으로 띄웠고 그 다음엔 별도 층(deck)이었다.
   둘 다 '이 블록을 고치는 일' 을 두 자리로 갈라 놓아, 서식은 취소를 눌러야 보였다.
   이제 서식 패널 안에 그대로 들어간다 — 한 블록의 일은 한 패널에서 끝난다. */
function buildImageEditor(host, block, initialSrc) {
  const isNew = !block;
  const draft = {
    src: block ? block.src : (initialSrc || ''),
    size: block ? (block.size ?? 60) : 60,
    round: block ? block.round !== false : true,
    ratio: '1:1'
  };
  /* [원본 msgCropModal] 제목·안내문·비율 4종·확대 1~3배·취소/원본 사용/확인 그대로 */
  const p = host;
  p.appendChild(el('div', 'sec-lab', '이미지'));
  const guide = el('p', 'modal-sub', '비율을 고르고, 이미지를 끌어 옮기거나 확대해서 틀에 맞춰주세요.');
  guide.style.margin = '0 0 12px';
  p.appendChild(guide);

  const crop = cropField(draft.src, draft.ratio);

  const ratios = el('div', 'crop-ratios');
  [['1:1', '정사각'], ['3:4', '세로'], ['4:3', '가로'], ['16:9', '와이드']].forEach(([r, sub]) => {
    const b = el('button', draft.ratio === r ? 'on' : '');
    b.innerHTML = `${r}<small>${sub}</small>`;
    b.onclick = () => {
      draft.ratio = r;
      [...ratios.children].forEach(x => x.classList.toggle('on', x === b));
      crop._setRatio(r);
    };
    ratios.appendChild(b);
  });

  const zoomWrap = el('div');
  zoomWrap.appendChild(el('span', 'lab', '확대'));
  const zoom = el('input', 'rng'); zoom.type = 'range'; zoom.step = '0.01';
  zoomWrap.appendChild(zoom);
  crop._onScale = base => { zoom.min = base; zoom.max = base * 3; zoom.value = base; };
  zoom.oninput = () => crop._zoom(parseFloat(zoom.value));

  /* 미리보기(자르기 틀)를 누르면 곧바로 이미지 선택으로 간다 — 별도 버튼을 두지 않는다 */
  const took = d => { draft.src = d; crop.style.cursor = 'grab'; };
  crop._onPick = took;                       /* 창에 떨군 사진 */
  const pick = () => pickImage(d => { took(d); crop._setSrc(d); });
  crop.addEventListener('click', e => { if (!draft.src) { e.stopPropagation(); pick(); } });
  if (!draft.src) crop.style.cursor = 'pointer';
  const reBtn = el('button', 'btn btn-quiet', '이미지 바꾸기');
  reBtn.style.cssText = 'position:absolute;right:8px;bottom:8px;z-index:4;box-shadow:var(--shadow-pop)';
  reBtn.onclick = e => { e.stopPropagation(); pick(); };

  const stage = el('div', 'crop-stage'); stage.style.position = 'relative';
  /* 크기(%)는 캔버스에서 차지할 폭이다. 틀을 그만큼 좁혀 실제 크기를 눈으로 보게 한다. */
  const sizer = el('div');
  sizer.style.cssText = 'width:100%;position:relative;transition:width .12s';
  sizer.appendChild(crop);
  /* 버튼은 틀이 아니라 스테이지 기준으로 붙인다 — 크기를 줄이면 틀을 따라
     안쪽으로 끌려 들어와 엉뚱한 자리에 놓였다. */
  stage.append(sizer, reBtn);

  const body = el('div', 'stack');
  body.append(ratios, stage, zoomWrap);

  /* 크기 — 스테퍼가 아니라 슬라이더 */
  const szWrap = el('div');
  const szLab = el('span', 'lab', '크기');
  const szVal = el('span', 'lab-sub', draft.size + '%'); szVal.style.cssText = 'display:inline;margin-left:6px';
  szLab.appendChild(szVal); szWrap.appendChild(szLab);
  const sz = el('input', 'rng'); sz.type = 'range'; sz.min = 10; sz.max = 100; sz.step = 5; sz.value = draft.size;
  const applySize = () => {
    szVal.textContent = draft.size + '%';
    sizer.style.width = draft.size + '%';
    requestAnimationFrame(() => crop._setRatio(draft.ratio));   /* 폭이 바뀌면 배율을 다시 맞춘다 */
  };
  sz.oninput = () => { draft.size = +sz.value; applySize(); };
  szWrap.appendChild(sz); body.appendChild(szWrap);

  body.appendChild(toggleRow('모서리 둥글게 출력', '', draft.round, v => {
    draft.round = v; crop.style.borderRadius = v ? '10px' : '0';
  }));
  crop.style.borderRadius = draft.round ? '10px' : '0';
  p.appendChild(body);
  applySize();

  const put = async src => {
    /* '원본 사용' 으로 들어온 파일은 자르기를 거치지 않아 몇 MB 짜리 그대로다 — 여기서 굽는다 */
    src = await shrinkImage(src, 1024);
    if (isNew) {
      addBlock({ type: 'image', src, size: draft.size, round: draft.round });
      /* 만든 그 블록을 이어서 고칠 수 있게 곧바로 고른 상태로 둔다 */
      S.ui.selectedBlockId = S.blocks[S.blocks.length - 1].id;
    } else Object.assign(block, { src, size: draft.size, round: draft.round });
    save();
    toast(isNew ? '이미지를 추가했습니다' : '이미지를 수정했습니다');
    backToDefault();          /* 넣었으면 끝난 일이다 */
  };

  /* 확정 단추는 묶음의 마지막 칸(sheet-foot)에 있다 — 여기서는 할 일만 걸어 둔다.
     취소는 NAV 의 [×] 가 한다. '원본 사용' 도 따로 둘 필요가 없다 —
     끌지도 확대하지도 않았으면 _export() 가 원본을 그대로 돌려주기 때문이다. */
  _confirm = () => {
    if (!draft.src) { toast('이미지를 먼저 선택하세요'); return; }
    put(crop._export() || draft.src);
  };
}

/* 캐릭터 이미지 모달 — 파일 · 링크 [원본 memberEditor 의 tabFile/tabLink] */
function openAvatarModal(cur, onDone) {
  const p = modal('캐릭터 이미지', '정사각형으로 잘라 넣습니다. 끌어서 위치를 맞추세요.');
  const crop = cropField(cur, '1:1');
  crop._maxPx = 256;
  const zoomWrap = el('div');
  zoomWrap.appendChild(el('span', 'lab', '확대'));
  const zoom = el('input', 'rng'); zoom.type = 'range'; zoom.step = '0.01';
  zoomWrap.appendChild(zoom);
  crop._onScale = base => { zoom.min = base; zoom.max = base * 3; zoom.value = base; };
  zoom.oninput = () => crop._zoom(parseFloat(zoom.value));

  const body = el('div', 'stack');
  const stage = el('div', 'crop-stage'); stage.style.position = 'relative';
  /* 미리보기를 누르면 곧바로 이미지 선택 — 별도 버튼도 파일/링크 탭도 두지 않는다 */
  crop._onPick = () => { reBtn.hidden = false; };
  const pick = () => pickImage(d => { crop._setSrc(d); reBtn.hidden = false; });
  crop.style.cursor = 'pointer';
  crop.addEventListener('click', e => { if (!crop._src) { e.stopPropagation(); pick(); } });
  const reBtn = el('button', 'btn btn-quiet', '이미지 바꾸기');
  reBtn.style.cssText = 'position:absolute;right:8px;bottom:8px;z-index:4;box-shadow:var(--shadow-pop)';
  reBtn.hidden = !cur;
  reBtn.onclick = e => { e.stopPropagation(); pick(); };
  stage.append(crop, reBtn);
  body.append(stage, zoomWrap);
  p.appendChild(body);

  const foot = el('div', 'modal-foot');
  const rm = el('button', 'btn btn-quiet', '제거'); rm.onclick = () => { closeModal(); onDone(''); };
  const cancel = el('button', 'btn btn-quiet', '취소'); cancel.onclick = closeModal;
  const ok = el('button', 'btn btn-primary', '확인');
  ok.onclick = () => {
    const d = crop._export() || cur || '';
    closeModal();
    /* 프로필은 캔버스에서 28px 로 그려진다 — 원본 해상도를 들고 있을 이유가 없다 */
    shrinkImage(d, 256).then(onDone);
  };
  foot.append(rm, cancel, ok); p.appendChild(foot);
}

/* ═══════════════════════════════════════════════════════════════
   도구
   ═══════════════════════════════════════════════════════════════ */
const HINTS = {
  character: '대사를 말할 캐릭터를 등록합니다. 블록을 말풍선으로 바꾸면 발화자로 고를 수 있습니다.',
  canvas: '내보낼 이미지의 크기와 여백입니다. 내용에 맞추거나, 비율을 정해 여러 장으로 나눠 저장할 수 있습니다.',
  theme: '배경·말풍선·프로필과 글자 서식을 한 테마로 저장합니다.'
};

function renderTools() {
  const wrap = $('#toolsWrap');
  /* 넓은 화면에서는 도구가 시트 위쪽에 늘 떠 있다 — 단계와 무관하다 */
  const on = isWide() || S.ui.stage === 'tools';
  wrap.hidden = !on;
  if (!on) return;
  wrap.querySelectorAll('.tab').forEach(t => t.classList.toggle('is-on', t.dataset.tool === S.ui.tool));
  $('#toolHint').textContent = HINTS[S.ui.tool] || '';
  const p = $('#toolPanel'); p.innerHTML = '';
  ({ character: panelCharacter, canvas: panelCanvas, theme: panelTheme })[S.ui.tool](p);
}

function panelCharacter(p) {
  const sec = el('div', 'sec');

  const ttl = el('div', 'sec-title', '캐릭터'); ttl.style.margin = '0';
  sec.appendChild(ttl);

  /* 목록과 [+] 를 한 줄에 둔다 — 추가 버튼이 제목 옆에 따로 떠 있으면
     '무엇에 더하는 버튼인가' 가 한 번 더 생각해야 알 수 있다. */
  const row = el('div', 'av-row'); row.style.marginTop = '9px';
  S.characters.forEach(c => {
    const slot = el('div', 'av-slot');
    const a = el('button', 'av-chip' + (S.ui.editingCharacterId === c.id ? ' is-on' : ''));
    if (c.avatar) { const i = el('img'); i.src = c.avatar; a.appendChild(i); } else a.innerHTML = initialSvg(c.name);
    a.title = c.name + (c.isMe ? ' · 내 캐릭터' : '');
    a.onclick = () => { S.ui.editingCharacterId = S.ui.editingCharacterId === c.id ? null : c.id; S.ui.charDraft = null; render(); };
    slot.appendChild(a);
    /* 내 캐릭터는 목록을 따로 두지 않고 프로필에 직접 표시한다 */
    if (c.isMe) { const bd = el('div', 'me-badge', '⭐'); bd.title = '내 캐릭터'; slot.appendChild(bd); }
    row.appendChild(slot);
  });
  const add = el('button', 'av-chip is-add');
  add.title = '캐릭터 추가';
  add.innerHTML = PLUS_SVG;
  add.onclick = () => { S.ui.editingCharacterId = 'new'; S.ui.charDraft = null; render(); };
  row.appendChild(add);
  sec.appendChild(row);
  if (!S.characters.length) {
    const e = el('div', 'lab-sub', '아직 등록한 캐릭터가 없습니다. [+] 로 추가하세요.');
    e.style.marginTop = '8px'; sec.appendChild(e);
  }

  if (S.ui.editingCharacterId) sec.appendChild(charEditor());
  p.appendChild(sec);
}

function charEditor() {
  const isNew = S.ui.editingCharacterId === 'new';
  /* 편집 중인 값은 이 함수의 지역 변수가 아니라 상태에 둔다.
     전에는 지역 변수였는데, 그러면 편집 도중 무슨 이유로든 화면을 다시 그릴 때
     초안이 통째로 새로 만들어진다. 이름을 쓰기 전에 이미지부터 고른 경우
     방금 고른 이미지가 그 순간 조용히 사라져 '저장이 안 되는' 것처럼 보였다.
     __for 로 편집 대상을 표시해 두고, 대상이 바뀌면 그때만 새로 만든다.
     테마 편집과 완전히 같은 얼개다 — 초안에 고치고 [저장] 으로 확정, [X] 로 버림. */
  if (!S.ui.charDraft || S.ui.charDraft.__for !== S.ui.editingCharacterId) {
    const base = isNew
      ? { id: uid(), name: '', avatar: '', useCustomBubble: false, bubbleBg: '#6C7A89', bubbleFg: '#FFFFFF', isMe: false }
      : Object.assign({}, charOf(S.ui.editingCharacterId));
    S.ui.charDraft = Object.assign(base, { __for: S.ui.editingCharacterId });
  }
  const c = S.ui.charDraft;
  const stored = isNew ? null : charOf(S.ui.editingCharacterId);
  const box = el('div', 'editcard');

  /* 저장하지 않은 수정이 있는가. 새 캐릭터는 이름이나 이미지가 들어온 뒤부터 저장할 수 있다 —
     빈 껍데기를 목록에 넣어 봐야 지울 일만 생긴다. */
  const bare = o => { const x = Object.assign({}, o); delete x.__for; return JSON.stringify(x); };
  const dirty = () => isNew
    ? !!(c.name || '').trim() || !!c.avatar || !!c.useCustomBubble || !!c.isMe
    : bare(c) !== bare(stored);

  /* 제목 오른쪽은 복제·닫기 자리다 — 삭제는 저장 옆(누르는 순서의 끝)으로 내렸다.
     지우는 버튼과 빠져나가는 버튼이 같은 자리에 있으면 손이 헷갈린다. */
  const head = el('div', 'row-between');
  const ttl = el('div', 'sec-title'); ttl.style.margin = '0';
  head.appendChild(ttl);
  const hg = el('div', 'row'); hg.style.gap = '6px';
  if (!isNew) {
    const dup = el('button', 'icb icb-sm', '⧉');
    dup.title = '이 캐릭터를 복제'; dup.setAttribute('aria-label', '캐릭터 복제');
    dup.onclick = () => {
      const copy = Object.assign({}, c); delete copy.__for;
      copy.id = uid();
      copy.name = (c.name || '캐릭터') + ' 사본';
      copy.isMe = false;                       /* '나' 는 한 명뿐이다 */
      S.characters.splice(S.characters.indexOf(stored) + 1, 0, copy);
      S.ui.editingCharacterId = copy.id; S.ui.charDraft = null;
      save(); render(); toast('캐릭터를 복제했습니다');
    };
    hg.appendChild(dup);
  }
  const cl = el('button', 'icb icb-sm');
  cl.title = '닫기 (저장하지 않은 수정은 버립니다)'; cl.setAttribute('aria-label', '닫기');
  cl.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  cl.onclick = () => {
    const had = dirty();
    S.ui.editingCharacterId = null; S.ui.charDraft = null;
    render();
    if (had) toast('수정을 취소했습니다');
  };
  hg.appendChild(cl); head.appendChild(hg);
  box.append(head, el('div', 'divider'));

  const top = el('div', 'row'); top.style.alignItems = 'flex-end';
  const avBtn = el('button', 'av-chip'); avBtn.style.cssText = 'width:56px;height:56px;flex:0 0 56px';
  /* 이미지가 없을 때 이름 첫 글자나 '?' 를 띄우면 여기가 사진을 넣는 자리라는 걸 알 수 없다.
     연필을 두어 눌러서 고치는 곳임을 보여준다. */
  const paint = () => {
    avBtn.innerHTML = '';
    avBtn.classList.toggle('is-pick', !c.avatar);
    if (c.avatar) { const i = el('img'); i.src = c.avatar; avBtn.appendChild(i); }
    else avBtn.textContent = '✏️';
  };
  avBtn.title = '이미지 편집';
  avBtn.onclick = () => openAvatarModal(c.avatar, d => { c.avatar = d; paint(); sync(); });
  const nb = el('div'); nb.style.flex = '1';
  nb.appendChild(el('span', 'lab', '이름'));
  const nameI = el('input', 'inp'); nameI.value = c.name; nameI.placeholder = '이름';
  /* 쓰는 즉시 초안에 담는다 — 이미지를 고르러 갔다 와도 쓰던 이름이 남는다 */
  nameI.oninput = () => { c.name = nameI.value; sync(); };
  nb.appendChild(nameI);
  top.append(avBtn, nb); box.appendChild(top); paint();

  box.appendChild(el('div', 'divider'));
  box.appendChild(toggleRow('말풍선 추가 설정', '별도 지정하지 않을 경우 테마에 따라 출력', c.useCustomBubble,
    v => { c.useCustomBubble = v; colors.hidden = !v; sync(); }));
  const colors = el('div', 'grid2'); colors.hidden = !c.useCustomBubble; colors.style.marginTop = '12px';
  colors.appendChild(colorField('말풍선 배경', c.bubbleBg, v => { c.bubbleBg = v; sync(); }));
  colors.appendChild(colorField('말풍선 글자', c.bubbleFg, v => { c.bubbleFg = v; sync(); }));
  box.appendChild(colors);

  box.appendChild(el('div', 'divider'));
  box.appendChild(toggleRow('내 캐릭터로 설정', '오른쪽 말풍선으로 출력', c.isMe, v => { c.isMe = v; sync(); }));

  /* 삭제·저장은 카드 하단 · 복제·닫기는 제목 옆 */
  const foot = el('div', 'modal-foot'); foot.style.marginTop = '16px';
  const del = isNew ? null : dangerBtn('삭제', 'char:' + c.id, () => {
    const used = S.blocks.filter(b => b.speakerId === c.id);
    used.forEach(b => { b.speakerId = null; });
    S.characters = S.characters.filter(x => x.id !== c.id);
    S.ui.editingCharacterId = null; S.ui.charDraft = null; save(); render();
    toast(used.length ? `삭제했습니다 · 블록 ${used.length}개의 발화자 해제` : '삭제했습니다');
  });
  const ok = el('button', 'btn btn-primary');
  ok.onclick = () => {
    c.name = (nameI.value || '').trim() || '이름 없음';
    if (c.isMe) S.characters.forEach(x => { if (x.id !== c.id) x.isMe = false; });
    /* __for 는 편집 중에만 쓰는 표시다 — 저장본에 섞여 들어가지 않게 떼고 넣는다 */
    const rec = Object.assign({}, c); delete rec.__for;
    if (isNew) S.characters.push(rec); else Object.assign(charOf(rec.id), rec);
    S.ui.charDraft = null;
    /* 새로 만든 뒤에는 목록으로 돌아가고, 고치던 중이면 그 자리에 남는다 —
       테마와 같은 규칙이다. */
    if (isNew) S.ui.editingCharacterId = null; else S.ui.editingCharacterId = rec.id;
    save(); render(); toast('저장했습니다');
  };
  if (del) { del.style.flex = '1'; foot.appendChild(del); }
  foot.appendChild(ok);
  box.appendChild(foot);

  /* 제목의 • 표시와 저장 버튼 상태는 초안이 바뀔 때마다 다시 잰다 —
     토글·색은 카드를 새로 그리지 않으므로 여기서 손으로 맞춰 준다. */
  function sync() {
    const d = dirty();
    ttl.textContent = (isNew ? '캐릭터 추가' : '수정하기') + (d ? ' •' : '');
    ttl.title = d ? '저장하지 않은 수정이 있습니다' : '';
    /* 아직 만든 적 없는 캐릭터에 '저장됨' 이라고 쓸 수는 없다 — 비활성으로만 둔다 */
    ok.textContent = (d || isNew) ? '저장' : '저장됨';
    ok.disabled = !d;
  }
  sync();
  return box;
}
/* 테마가 소유하는 글자 설정 한 벌. */
function fontControls(g, up) {
  const sec = el('div', 'sec');

  /* 글꼴 · 굵기 — 한 줄 */
  const r1 = el('div', 'grid2'); r1.style.alignItems = 'end';
  const f1 = el('div'); f1.appendChild(el('span', 'lab', '글꼴'));
  f1.appendChild(fontSelect(g.font, v => { g.font = v; clearBlockOwn('font', '글꼴'); up(); }));
  const f2 = el('div'); f2.appendChild(el('span', 'lab', '굵기'));
  f2.appendChild(segment([[400, '보통'], [600, '굵게'], [800, '아주 굵게']], g.weight,
    v => { g.weight = +v; clearBlockOwn('bold', '굵기'); up(); }));
  r1.append(f1, f2); sec.appendChild(r1);

  /* 글 정렬 */
  const r2 = el('div'); r2.style.marginTop = '12px';
  r2.appendChild(el('span', 'lab', '글 정렬'));
  r2.appendChild(segment(Object.keys(ALIGN_ICON).map(k => [k, `<svg viewBox="0 0 24 24"><path d="${ALIGN_ICON[k]}"/></svg>`, true]),
    g.align, v => { g.align = v; clearBlockOwn('align', '글 정렬'); up(); }));
  sec.appendChild(r2);

  /* 위(글꼴·굵기·정렬)는 '무엇으로 쓰나', 아래는 '얼마나' 다. 성격이 달라 선으로 가른다. */
  const dv = el('div', 'divider'); dv.style.margin = '16px 0';
  sec.appendChild(dv);

  /* 글꼴 상세 설정 — 2열 가로 스테퍼.
     제목이 스테퍼 라벨(.lab)과 같은 크기면 어느 쪽이 제목인지 알 수 없다.
     '캔버스 여백' 과 같은 구획 제목(.sec-lab)으로 한 단 올린다. */
  const r3 = el('div');
  r3.appendChild(el('span', 'sec-lab', '글꼴 상세 설정'));
  const gr = el('div', 'grid2'); gr.style.rowGap = '9px';
  gr.appendChild(stepH('크기', g.size, 6, 60, .5, v => { g.size = v; up(); }, 1));
  gr.appendChild(stepH('행간', g.lineHeight * 100, 100, 250, 5, v => { g.lineHeight = v / 100; up(); }, 1));
  gr.appendChild(stepH('자간', g.letterSpacing * 100, -20, 30, .1, v => { g.letterSpacing = v / 100; up(); }, 1));
  gr.appendChild(stepH('문단 간격', g.blockGap, 0, 60, 1, v => { g.blockGap = v; up(); }));
  r3.appendChild(gr); sec.appendChild(r3);

  return sec;
}

function panelCanvas(p) {
  const c = S.canvas;
  const sec = el('div', 'sec');

  /* 캔버스를 정하는 방식은 둘 중 하나다 — 쓴 만큼 나오게 두거나, 한 장의 규격을 먼저 정하거나.
     둘은 딸린 설정도 다르므로 고른 쪽만 보여 준다. */
  /* '설정' 은 도구 이름과 겹치고 '비율' 은 두 갈래 중 한쪽 이름이라 둘 다 제목으로는 못 쓴다.
     판형 — 한 장을 어떤 꼴로 뽑을지, 인쇄에서 쓰던 말 그대로다. */
  sec.appendChild(el('span', 'sec-lab', '판형'));
  sec.appendChild(segment([['fit', '내용에 맞춤'], ['ratio', '비율을 지정']], c.mode || 'ratio',
    v => { c.mode = v; save(); render(); }));

  const hint = el('div', 'lab-sub');
  hint.style.margin = '9px 0 0';
  hint.textContent = isFit()
    ? '내용에 맞춰 캔버스 크기와 비율이 함께 수정'
    : '비율에 맞춰 페이지를 여러 장으로 자동 분할';
  sec.appendChild(hint);

  const body = el('div'); body.style.marginTop = '14px';
  if (isFit()) {
    /* 높이는 내용이 정하므로 사람이 정할 것은 폭 하나뿐이다 [원본 lyWidth 300~1000] */
    const lab = el('span', 'lab', '캔버스 좌우 너비');
    const val = el('span', 'lab-sub', (c.width ?? 560) + 'px');
    val.style.cssText = 'display:inline;margin-left:6px';
    lab.appendChild(val); body.appendChild(lab);
    const r = el('input', 'rng');
    r.type = 'range'; r.min = 300; r.max = 1000; r.step = 10; r.value = c.width ?? 560;
    /* 끄는 동안은 캔버스만 다시 그린다 — 도구 패널까지 새로 그리면 잡고 있던 손잡이가 사라진다 */
    r.oninput = () => { c.width = +r.value; val.textContent = c.width + 'px'; renderCanvas(); };
    r.onchange = () => save();
    body.appendChild(r);
    const note = el('div', 'lab-sub', '화면이 이 값보다 좁으면 통째로 줄여서 보여 줍니다 — 저장되는 그림은 늘 이 폭 그대로입니다.');
    note.style.marginTop = '6px';
    body.appendChild(note);
  } else {
    body.appendChild(el('span', 'lab', '캔버스 비율'));
    const RSUB = { '9:16': '세로', '3:4': '세로형', '1:1': '정사각', '4:3': '가로', '16:9': '와이드' };
    body.appendChild(segment(Object.keys(RATIOS).map(k => [k, `${k}<small>${RSUB[k]}</small>`, true]),
      c.ratio, v => { c.ratio = v; save(); render(); }));
  }
  sec.appendChild(body);

  const dv = el('div', 'divider'); dv.style.margin = '16px 0';
  sec.appendChild(dv);

  const mw = el('div');
  const head = el('div', 'row-between');
  const l = el('span', 'sec-lab', '캔버스 여백'); l.style.margin = '0';
  head.appendChild(l);
  /* 열림·닫힘을 그대로 보여주는 꺾쇠. '나누기'/'합치기' 는 눌러 봐야 뭐가 되는지 알 수 있었다. */
  const tg = el('button', 'icb icb-sm');
  tg.title = c.marginDetail ? '여백 합치기 — 위아래·좌우' : '여백 나누기 — 위·아래·좌·우 따로';
  tg.innerHTML = `<svg viewBox="0 0 24 24"><path d="${c.marginDetail ? 'M18 15l-6-6-6 6' : 'M6 9l6 6 6-6'}"/></svg>`;
  tg.onclick = () => { c.marginDetail = !c.marginDetail; save(); render(); };
  head.appendChild(tg); mw.appendChild(head);
  const box = el('div', 'grid2'); box.style.cssText = 'margin-top:9px;row-gap:9px';
  if (c.marginDetail) {
    box.appendChild(stepH('위', c.mt, 0, 160, 2, v => { c.mt = v; save(); render(); }));
    box.appendChild(stepH('좌측', c.ml, 0, 160, 2, v => { c.ml = v; save(); render(); }));
    box.appendChild(stepH('아래', c.mb, 0, 160, 2, v => { c.mb = v; save(); render(); }));
    box.appendChild(stepH('우측', c.mr, 0, 160, 2, v => { c.mr = v; save(); render(); }));
  } else {
    box.appendChild(stepH('위아래', c.mt, 0, 160, 2, v => { c.mt = c.mb = v; save(); render(); }));
    box.appendChild(stepH('좌우', c.ml, 0, 160, 2, v => { c.ml = c.mr = v; save(); render(); }));
  }
  mw.appendChild(box); sec.appendChild(mw);
  p.appendChild(sec);
}

function panelTheme(p) {
  const s = el('div', 'sec');
  const ttl = el('div', 'sec-title', '테마'); ttl.style.margin = '0';
  s.appendChild(ttl);

  const grid = el('div', 'theme-grid'); grid.style.marginTop = '9px';
  S.themes.forEach(t => {
    const card = el('button', 'theme-card' + (t.id === S.activeThemeId ? ' is-on' : ''));
    const sw = el('div', 'sw'); sw.style.background = t.bg;
    const dot = el('div'); dot.style.cssText = `width:20px;height:12px;border-radius:2px;background:${t.bubbleBg}`;
    sw.appendChild(dot); card.appendChild(sw);
    card.appendChild(el('div', 'nm', t.name || '이름'));
    card.onclick = () => {
      const drop = !!S.ui.themeDraft && S.ui.themeDraft.id !== t.id;
      if (S.activeThemeId === t.id) S.ui.editingThemeId = S.ui.editingThemeId === t.id ? null : t.id;
      else { S.activeThemeId = t.id; S.ui.editingThemeId = null; }
      /* 다른 테마로 넘어가면 고치던 초안은 버린다 — 두 테마를 한꺼번에 고칠 수는 없다 */
      if (S.ui.editingThemeId !== (S.ui.themeDraft && S.ui.themeDraft.id)) S.ui.themeDraft = null;
      save(); render();
      if (drop) toast('고치던 테마의 수정을 취소했습니다');
    };
    grid.appendChild(card);
  });
  /* 추가 버튼도 카드 하나로 목록 끝에 세운다 — 미리보기와 같은 네모라 줄이 어긋나지 않는다 */
  const add = el('button', 'theme-card is-add');
  add.title = '테마 추가';
  add.innerHTML = PLUS_SVG;
  /* 새 테마를 활성으로 올린다. 안 그러면 편집기는 새 테마를 가리키는데 캔버스는
     이전 테마를 그리고 있어서, 색을 바꿔도 미리보기가 꿈쩍하지 않는다. */
  add.onclick = () => {
    const t = DEF_THEME(); t.name = '새 테마';
    S.themes.push(t); S.activeThemeId = t.id; S.ui.editingThemeId = t.id; S.ui.themeDraft = null;
    save(); render();
  };
  grid.appendChild(add);
  s.appendChild(grid);
  if (S.ui.editingThemeId) s.appendChild(themeEditor());
  p.appendChild(s);
}

function themeEditor() {
  const src = S.themes.find(x => x.id === S.ui.editingThemeId);
  if (!src) return el('div');
  /* 테마는 색·여백·글꼴을 한꺼번에 갈아 끼우는 물건이라 손대는 즉시 굳으면 되돌리기 어렵다.
     그래서 사본(초안)을 놓고 고친다 — 미리보기는 초안을 그리고(theme() 이 초안을 돌려준다),
     저장소에는 [저장] 을 눌러야 옮겨 담는다. 닫으면 초안째 버린다. */
  if (!S.ui.themeDraft || S.ui.themeDraft.id !== src.id) {
    S.ui.themeDraft = JSON.parse(JSON.stringify(src));
  }
  const t = S.ui.themeDraft;
  const box = el('div', 'editcard');
  const up = () => renderCanvas();
  const dirty = JSON.stringify(t) !== JSON.stringify(src);

  /* 캐릭터 편집과 같은 머리 — 제목 왼쪽, 복제·닫기 오른쪽 */
  const head = el('div', 'row-between');
  const ttl = el('div', 'sec-title', '수정하기' + (dirty ? ' •' : ''));
  ttl.style.margin = '0';
  ttl.title = dirty ? '저장하지 않은 수정이 있습니다' : '';
  head.appendChild(ttl);
  const hg = el('div', 'row'); hg.style.gap = '6px';
  /* 기본 제공 테마에만 둔다 — 되돌릴 '처음' 이 있는 것은 그것들뿐이다.
     색·여백·꼬리·프로필까지 통째로 처음 상태가 된다. 초안만 바꾸므로 [저장] 전에는 되돌릴 수 있다. */
  if (presetOf(src)) {
    const rs = el('button', 'icb icb-sm', '↺');
    rs.title = '이 테마를 기본값으로'; rs.setAttribute('aria-label', '기본값으로');
    rs.onclick = () => {
      const f = freshPreset(src);
      if (!f) return;
      Object.keys(t).forEach(k => { if (!(k in f)) delete t[k]; });
      Object.assign(t, f);
      render(); toast('기본값으로 되돌렸습니다 · 저장해야 확정됩니다');
    };
    hg.appendChild(rs);
  }
  /* 복제 — 마음에 드는 테마에서 한 군데만 바꿔 쓰고 싶을 때가 대부분이라

function segment(items, cur, on) {

    const b = el('button', String(cur) === String(v) ? 'is-on' : '');
    if (isHtml) b.innerHTML = l; else b.textContent = l;
    b.onclick = () => on(v);
    s.appendChild(b);
  });
  return s;
}
function toggleRow(label, sub, val, on) {
  const r = el('div', 'row-between');

  L.appendChild(t1);

  t.onclick = () => { const nv = !t.classList.contains('is-on'); t.classList.toggle('is-on', nv); on(nv); };
  r.append(L, t);
  return r;
}
/* dec=1 이면 소수점 한 자리까지 받는다. 음수도 그대로 받는다. */
/* 라벨과 컨트롤을 한 줄에 놓는다. 세로로 쌓으면 패널이 금세 길어진다. */
function stepH(label, val, min, max, step, on, dec) {
  const r = el('div', 'steph');
  r.appendChild(el('span', 'lab', label));
  const s = el('div', 'step');
  const minus = el('button', '', '−'), plus = el('button', '', '+');
  const i = el('input'); i.type = 'text'; i.inputMode = dec ? 'decimal' : (min < 0 ? 'text' : 'numeric');
  const fmt = v => dec ? String(Math.round(v * 10) / 10) : String(Math.round(v));
  i.value = fmt(val);
  const read = () => { const n = parseFloat(String(i.value).replace(/[^\d.\-]/g, '')); return Number.isFinite(n) ? n : 0; };
  const set = v => { v = clamp(dec ? Math.round(v * 10) / 10 : Math.round(v), min, max); i.value = fmt(v); on(v); };
  minus.onclick = () => set(read() - step);
  plus.onclick = () => set(read() + step);
  i.onchange = () => set(read());
  s.append(minus, i, plus); r.appendChild(s);
  return r;
}

/* ═══ 이미지 굽기 ═══════════════════════════════════════════
   작업 내용은 localStorage 에 통째로 들어간다. 그 칸은 5MB 안팎인데 요즘 사진은
   한 장이 그보다 크다 — 고른 파일을 그대로 담으면 캐릭터 두어 명에 저장이 통째로
   실패하고, 화면에는 멀쩡히 보이니 새로고침하기 전까지 알 수도 없다.
   그래서 넣기 전에 반드시 다시 굽는다. webp 는 같은 그림을 png 의 1/5~1/10 로 줄이고
   투명도도 그대로 살린다 — 못 쓰는 브라우저에서는 png 로 떨어진다. */
function encodeCanvas(cv) {
  try {
    const w = cv.toDataURL('image/webp', 0.92);
    if (w.indexOf('data:image/webp') === 0) return w;
  } catch (_) { }
  return cv.toDataURL('image/png');
}
/* 비율은 그대로 두고 긴 변만 maxPx 로 줄여 다시 굽는다. 실패하면 원본을 돌려준다. */
function shrinkImage(src, maxPx) {
  return new Promise(res => {
    if (!src || !/^data:image\//i.test(src)) { res(src); return; }
    const im = new Image();
    im.onload = () => {
      try {
        const w = im.naturalWidth, h = im.naturalHeight;
        if (!w || !h) { res(src); return; }
        const k = Math.min(1, maxPx / Math.max(w, h));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
        const g = cv.getContext('2d');
        if (!g) { res(src); return; }
        g.drawImage(im, 0, 0, cv.width, cv.height);
        const out = encodeCanvas(cv);
        res(out && out.length < src.length ? out : src);
      } catch (e) { console.warn('이미지 굽기 실패 — 원본 사용', e); res(src); }
    };
    im.onerror = () => res(src);
    im.src = src;
  });
}

   막고, 그 위에서 이미지 파일일 때만 편집 모달로 넘긴다.
   모달이 열려 있으면 새로 만들지 않고 지금 자르고 있는 틀의 그림을 갈아 끼운다. */
(function initDropImage() {
  const veil = el('div', 'drop-veil', '사진을 놓으면 이미지 블록으로 추가됩니다');
  let depth = 0;
  const hasFiles = e => {
    const dt = e.dataTransfer;
    if (!dt) return false;
    if (dt.types && [...dt.types].indexOf('Files') >= 0) return true;
    return !!(dt.files && dt.files.length);
  };

    readImageFile(f, d => startNew('image', d));

})();

/* 물려받는 값이 SVG 안에서 달라지지 않게 계산된 타이포를 그대로 박아 둔다 */
function copyTypography(src, dst) {
  const a = [src, ...src.querySelectorAll('*')], b = [dst, ...dst.querySelectorAll('*')];
  for (let i = 0; i < Math.min(a.length, b.length); i++) {
    if (!a[i].textContent || !a[i].textContent.trim()) continue;
    const cs = getComputedStyle(a[i]), st = b[i].style;
    ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'lineHeight', 'letterSpacing',
     'wordSpacing', 'textAlign', 'textIndent', 'textDecoration', 'wordBreak', 'overflowWrap']
      .forEach(k => { st[k] = cs[k]; });
  }
}
function captureClone(cv) {
  /* 좁은 화면에서는 미리보기를 통째로 줄여 두었다 [fitCanvas]. getBoundingClientRect 는
     그 축소를 그대로 타므로, 재는 동안만 축소를 풀어 늘 논리 크기로 잰다.
     여기서는 아무것도 기다리지 않으니(전부 동기) 푼 모습이 화면에 그려질 틈은 없다. */
  const keepTransform = cv.style.transform;
  if (keepTransform && keepTransform !== 'none') cv.style.transform = 'none';
  try {
    return captureCloneAt(cv);
  } finally {
    if (keepTransform && keepTransform !== 'none') cv.style.transform = keepTransform;
  }
}
function captureCloneAt(cv) {
  const w = Math.ceil(cv.offsetWidth), h = Math.ceil(cv.offsetHeight);
  const host = el('div');
  host.setAttribute('aria-hidden', 'true');
  host.style.cssText = 'position:fixed;left:-100000px;top:0;margin:0;padding:0;overflow:hidden;'
    + 'pointer-events:none;z-index:-2147483647;width:' + w + 'px;height:' + h + 'px';
  const clone = cv.cloneNode(true);
  copyTypography(cv, clone);
  clone.style.setProperty('transform', 'none', 'important');
  clone.style.setProperty('transition', 'none', 'important');
  clone.style.setProperty('margin', '0', 'important');
  clone.style.setProperty('box-shadow', 'none', 'important');
  ['width', 'min-width', 'max-width'].forEach(k => clone.style.setProperty(k, w + 'px', 'important'));
  ['height', 'min-height', 'max-height'].forEach(k => clone.style.setProperty(k, h + 'px', 'important'));
  clone.querySelectorAll('.pagemark').forEach(n => n.remove());
  clone.querySelectorAll('.blk').forEach(n => {
    n.classList.remove('is-sel', 'picked', 'dragging');
    n.style.setProperty('outline', 'none', 'important');
  });
  host.appendChild(clone);
  document.body.appendChild(host);

  const from = [...cv.querySelectorAll(FLOW_SEL)], to = [...clone.querySelectorAll(FLOW_SEL)];
  for (let i = 0; i < Math.min(from.length, to.length); i++) {
    const f = from[i], c = to[i];
    if (!f.textContent || !f.textContent.trim()) continue;
    /* 폭뿐 아니라 높이까지 고정한다. foreignObject 안에서 한 줄짜리 말풍선에
       빈 줄 높이가 덧붙는 일이 있어 상자 기하를 통째로 못 박는다. [원본 bubbleBoxes] */
    const r = f.getBoundingClientRect();
    if (r.width && r.height) {
      c.style.setProperty('box-sizing', 'border-box', 'important');
      ['width', 'min-width', 'max-width'].forEach(k => c.style.setProperty(k, r.width.toFixed(2) + 'px', 'important'));
      ['height', 'min-height', 'max-height'].forEach(k => c.style.setProperty(k, r.height.toFixed(2) + 'px', 'important'));
    }
    if (getComputedStyle(f).textAlign === 'justify') continue;
    const pts = softBreaks(f);
    if (!pts.length) continue;
    insertBreaks(c, pts);
    /* nowrap 이 아니라 pre 다. nowrap 은 '줄을 안 넘김' 과 함께 '공백 접기' 까지 켜서
       글자로 들어온 줄바꿈(\n)을 공백 하나로 뭉갠다 — 여러 줄로 쓴 대사가 저장하면
       한 줄로 붙어 나오던 원인이 이것이다. pre 는 접지 않으면서 줄만 안 넘긴다. */
    c.style.setProperty('white-space', 'pre', 'important');
    c.style.setProperty('word-break', 'normal', 'important');
    c.style.setProperty('overflow-wrap', 'normal', 'important');
  }
  return { host, clone, w, h };
}

/* [원본 __fontSample / usedFontWeights / __ensureCurrentFontLoaded]
   document.fonts.ready 는 "지금 걸려 있는 로딩" 이 끝나면 풀린다. Pretendard 는
   동적 서브셋이라 브라우저가 필요한 조각만 그때그때 받는데, 캡처 직전에 아직 안 받은
   조각이 있으면 그 글자만 대체 글꼴로 그려져 줄이 밀린다.
   그래서 캔버스에 실제로 쓰인 글자 전부를 표본으로 넘겨 쓰인 굵기마다 강제로 받아 둔다. */
function fontSample(node) {
  const raw = ((node && node.innerText) || '').replace(/\s+/g, '');
  return [...new Set(Array.from(raw))].join('').slice(0, 2400) || '가나다ABC123';
}
function usedWeights(node) {
  const set = new Set();
  [node, ...node.querySelectorAll('*')].forEach(e => {
    if (!e.textContent || !e.textContent.trim()) return;
    const n = parseInt(getComputedStyle(e).fontWeight, 10);
    set.add(Number.isFinite(n) ? Math.max(100, Math.min(900, Math.round(n / 100) * 100)) : 400);
  });
  if (!set.size) set.add(400);
  return [...set];
}
const withTimeout = (p, ms, val) => Promise.race([Promise.resolve(p), new Promise(r => setTimeout(() => r(val), ms))]);
async function ensureFontsLoaded(node) {
  if (!document.fonts || !document.fonts.load) return;
  const sample = fontSample(node);
  const g = fmt();
  const px = Math.max(12, Number(g.size) || 16);
  const names = usedFonts();
  await Promise.all(names.map(n => ensureFontCss(n)));
  const jobs = [];
  names.forEach(n => usedWeights(node).forEach(w =>
    jobs.push(document.fonts.load(`${w} ${px}px "${n}"`, sample).catch(() => { }))));
  await withTimeout(Promise.all(jobs), 8000);
  try { await withTimeout(document.fonts.ready, 4000); } catch (_) { }
}

function waitForImages(root) {
  return Promise.all([...root.querySelectorAll('img')].map(img => {
    if (img.complete && img.naturalWidth) return img.decode ? img.decode().catch(() => { }) : null;
    return new Promise(res => {
      const done = () => res();
      img.addEventListener('load', done, { once: true });
      img.addEventListener('error', done, { once: true });
      setTimeout(done, 8000);
    });
  }));
}

/* iOS Safari 는 화면에서 정상 표시한 HEIC/WebP/data URL 이미지도 html-to-image 가 만드는
   SVG foreignObject 안에서는 다시 디코드하지 못해, 저장 결과에서 <img> 만 투명하게 빠질
   때가 있다. 캡처용 복제본에 한해 이미 디코드된 픽셀을 PNG data URL 로 다시 구워 넣는다.
   원본 상태는 건드리지 않으므로 기존에 등록해 둔 이미지에도 바로 적용된다. */
async function bakeImagesForExport(root) {
  const imgs = [...root.querySelectorAll('img')];
  await Promise.all(imgs.map(async img => {
    try {
      if (!img.complete || !img.naturalWidth || !img.naturalHeight) return;
      const maxSide = 4096;
      const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.naturalWidth * k));
      cv.height = Math.max(1, Math.round(img.naturalHeight * k));
      const g = cv.getContext('2d');
      if (!g) return;
      g.drawImage(img, 0, 0, cv.width, cv.height);
      const png = cv.toDataURL('image/png');
      if (!png || png === 'data:,') return;
      img.src = png;
      if (img.decode) await img.decode().catch(() => { });
    } catch (e) {
      /* 외부 HTML 안의 CORS 이미지처럼 캔버스에 못 그리는 항목은 기존 경로에 맡긴다. */
      console.warn('저장용 이미지 PNG 변환 실패 — 원본 사용', e);
    }
  }));
}

/* 래스터는 검증된 toPng 을 그대로 쓴다. 원본이 toSvg 로 간 이유는 초대형 캔버스의
   배율 제어였지 글자 밀림이 아니었고, 여기서는 임베드한 글꼴(1.6MB)을 물고 SVG 를
   디코드하다 멈추는 쪽이 더 큰 문제였다.
   밀림을 막는 것은 래스터 방식이 아니라 그 앞의 세 가지다 —
   서브셋 강제 로드 · 줄바꿈/상자 고정 · font-display:block. */
async function renderExact(hti, node, w, h, scale, fontCss, bg) {
  const base = {
    width: w, height: h, pixelRatio: scale, cacheBust: false, preferredFontFormat: 'woff2',
    backgroundColor: bg,
    style: {
      transform: 'none', transformOrigin: 'top left', margin: '0', boxShadow: 'none',
      width: w + 'px', height: h + 'px'
    }
  };
  /* 글꼴을 다 심었으면 그걸로, 못 심었으면 skipFonts 로. 중간(외부 url 잔존)은 두지 않는다. */
  const variants = fontCss ? [{ ...base, fontEmbedCSS: fontCss }, { ...base, skipFonts: true }]
                           : [{ ...base, skipFonts: true }];
  let last;
  for (const opt of variants) { try { return await hti.toPng(node, opt); } catch (e) { last = e; } }
  throw last || new Error('저장 실패');
}

const exportRatio = w => clamp(1440 / Math.max(1, w), 2, 4);
const raf2 = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
function download(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ═══ 저장 결과 넘기기 [원본 mobile-save-choice / mobileSavedImageViewer] ═══
   손안에서는 a[download] 가 사진첩까지 가지 못한다. 아이폰은 내려받은 파일이 '파일' 앱에
   떨어질 뿐이고 인앱 브라우저에서는 아예 막히기도 한다. 사진첩으로 가는 길은 공유 시트뿐이라
   (navigator.share 로 파일을 넘기면 '이미지 저장' 이 뜬다) 만든 그림을 화면에 띄우고
   거기서 공유·복사·내려받기를 고르게 한다. 이미지를 길게 눌러 저장하는 길도 함께 남는다.
   PC 는 지금까지처럼 그냥 내려받는다 — 창을 하나 더 띄울 이유가 없다. */
const isIOS = () => /iPad|iPhone|iPod/i.test(navigator.userAgent || '')
  || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
const isHandheld = () => isIOS() || ((navigator.maxTouchPoints || 0) > 0 && innerWidth <= 900);

let _saved = [];
const clearSaved = () => { _saved.forEach(s => URL.revokeObjectURL(s.url)); _saved = []; };

async function deliver(items) {
  if (!isHandheld()) {
    items.forEach((it, i) => setTimeout(() => download(it.url, it.name), i * 450));
    toast(items.length > 1 ? `${items.length}장으로 저장했습니다` : '저장했습니다');
    return;
  }
  /* 공유에 넘기려면 File 이어야 한다 — data URL 을 blob 으로 되돌린다 */
  const out = [];
  for (const it of items) {
    const blob = await fetch(it.url).then(r => r.blob());
    out.push({ blob, url: URL.createObjectURL(blob), name: it.name });
  }
  openSaveSheet(out);
}

function openSaveSheet(items) {
  clearSaved();
  _saved = items;
  const root = $('#saveSheet');
  root.innerHTML = '';
  const panel = el('div', 'savesheet-panel');
  panel.appendChild(el('div', 'savesheet-title',
    items.length > 1 ? `이미지 ${items.length}장이 완성됐습니다` : '이미지가 완성됐습니다'));
  panel.appendChild(el('p', 'savesheet-sub', isIOS()
    ? '공유를 눌러 “이미지 저장”을 고르면 사진첩에 들어갑니다. 아래 이미지를 길게 눌러 저장해도 됩니다.'
    : '내려받거나 다른 앱으로 보낼 수 있습니다.'));

  const prev = el('div', 'savesheet-prev');
  items.forEach(s => { const i = el('img'); i.src = s.url; i.alt = s.name; prev.appendChild(i); });
  panel.appendChild(prev);

  const acts = el('div', 'savesheet-acts');
  const canShare = !!(navigator.share && typeof File !== 'undefined');
  if (canShare) {
    const b = el('button', 'btn btn-primary', '↗ 공유 · 사진 앱에 저장');
    b.onclick = shareSaved; acts.appendChild(b);
  }
  const dl = el('button', 'btn ' + (canShare ? 'btn-quiet' : 'btn-primary'), '↓ 이미지 내려받기');
  dl.onclick = () => _saved.forEach((s, i) => setTimeout(() => download(s.url, s.name), i * 450));
  acts.appendChild(dl);
  if (items.length === 1 && navigator.clipboard && typeof ClipboardItem !== 'undefined') {
    const cp = el('button', 'btn btn-quiet', '⧉ 이미지 복사');
    cp.onclick = copySaved; acts.appendChild(cp);
  }
  const cl = el('button', 'btn btn-quiet', '닫기');
  cl.onclick = closeSaveSheet; acts.appendChild(cl);
  panel.appendChild(acts);

  root.appendChild(panel);
  root.classList.add('is-on');
  root.onclick = e => { if (e.target === root) closeSaveSheet(); };
}
function closeSaveSheet() {
  const root = $('#saveSheet');
  root.classList.remove('is-on'); root.innerHTML = ''; root.onclick = null;
  clearSaved();
}
/* 공유는 사용자가 누른 그 순간에 불러야 한다 — 앞에 await 를 두면 iOS 가 제스처로 안 쳐준다 */
function shareSaved() {
  if (!_saved.length) return;
  let files;
  try { files = _saved.map(s => new File([s.blob], s.name, { type: 'image/png' })); }
  catch (_) { toast('이 브라우저에서는 공유할 수 없습니다'); return; }
  if (navigator.canShare && !navigator.canShare({ files })) {
    toast('이 브라우저에서는 이미지 공유가 막혀 있습니다 · 길게 눌러 저장해주세요');
    return;
  }
  navigator.share({ files }).catch(e => {
    if (e && e.name === 'AbortError') return;
    console.warn('공유 실패', e);
    toast('공유하지 못했습니다 · 이미지를 길게 눌러 저장해주세요');
  });
}
function copySaved() {
  navigator.clipboard.write([new ClipboardItem({ 'image/png': _saved[0].blob })])
    .then(() => toast('이미지를 복사했습니다'))
    .catch(e => { console.warn(e); toast('브라우저가 이미지 복사를 막았습니다'); });
}

async function exportPNG() {
  if (!S.blocks.length) { toast('내보낼 블록이 없습니다'); return; }
  const cv = $('#canvas');
  const wasSel = S.ui.selectedBlockId;
  S.ui.selectedBlockId = null;
  renderCanvas();
  cv.querySelectorAll('.pagemark').forEach(n => n.remove());

  const ranges = isFit() ? null : pageRanges();
  const multi = ranges && ranges.length > 1;
  const rows = pageRows();
  const stamp = new Date().toISOString().slice(0, 10);

  toast(multi ? `${ranges.length}장으로 저장합니다…` : '저장 준비 중…');
  try {
    const hti = await loadHTI();
    /* fonts.ready 만으로는 부족하다 — 쓰인 글자·굵기의 서브셋을 강제로 받아 둔다 */
    await ensureFontsLoaded(cv);
    /* 글꼴 인라인이 늦어도 저장 자체가 멈추면 안 된다 — 넘기면 skipFonts 로 간다 */
    /* 화면에 실제로 쓰인 굵기만 심는다 — 안 쓰는 굵기를 같이 심으면 용량만 몇 배가 된다 */
    const css = await withTimeout(fontEmbedCSS(cv.innerText || '', usedWeights(cv)), 20000, '');
    const scale = exportRatio(cv.clientWidth);
    const bg = theme().bg;
    /* 화면이 아니라 줄바꿈·상자 크기를 못 박은 클론을 SVG 로 뽑아 정확한 크기로 그린다 */
    const shoot = async () => {
      const snap = captureClone(cv);
      try {
        await waitForImages(snap.clone);
        await bakeImagesForExport(snap.clone);
        await raf2();
        return await renderExact(hti, snap.clone, snap.w, snap.h, scale, css, bg);
      } finally { snap.host.remove(); }
    };
    if (!multi) {
      const url = await shoot();
      await deliver([{ url, name: `발췌_${stamp}.png` }]);
      return;
    }
    const box = pageBox();
    cv.style.aspectRatio = 'auto'; cv.style.height = box.h + 'px'; cv.style.minHeight = '0';
    const urls = [];
    for (let i = 0; i < ranges.length; i++) {
      const [from, to] = ranges[i];
      rows.forEach((n, j) => n.classList.toggle('row-off', j < from || j >= to));
      /* 한 장만 남긴 저장용 캔버스에서는 그 장의 내용 묶음을 세로 중앙에 둔다. */
      cv.classList.add('ratio-center');
      await raf2();
      /* 장마다 다시 잰다 — 남은 행이 맨 위부터 쌓이면서 줄 위치가 달라진다 */
      urls.push(await shoot());
      toast(`이미지 만드는 중… (${i + 1}/${ranges.length})`);
    }
    rows.forEach(n => n.classList.remove('row-off'));
    await deliver(urls.map((u, i) => ({ url: u, name: `발췌_${stamp}-${i + 1}.png` })));
  } catch (e) {
    console.error(e); toast('저장에 실패했습니다');
  } finally {
    rows.forEach(n => n.classList.remove('row-off'));
    S.ui.selectedBlockId = wasSel; renderCanvas();
  }
}

/* ═══ 설정 내보내기 · 들여오기 ═══════════════════════════════
   [원본 exportProject / importProject 를 설정만 담게 줄인 것]
   블록(작업 내용)은 빼고 다시 쓰게 될 것만 담는다 —
   캐릭터 · 서식 설정 · 캔버스 설정 · 저장한 테마.
   ═══════════════════════════════════════════════════════════ */
const SETTINGS_TYPE = 'chat-excerpt/settings';

function exportSettings() {
  const data = {
    __type: SETTINGS_TYPE, __v: 1,
    characters: S.characters, format: S.format, canvas: S.canvas,
    themes: S.themes, activeThemeId: S.activeThemeId,
    palette: userPalette, colors: S.colors
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  download(url, `발췌설정_${new Date().toISOString().slice(0, 10)}.json`);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`설정을 내보냈습니다 · 캐릭터 ${S.characters.length} · 테마 ${S.themes.length}`);
}

function applySettings(d) {
  if (!d || typeof d !== 'object') return false;
  /* 판 표시가 없어도 모양만 맞으면 받는다 — 손으로 고친 파일도 쓸 수 있게 */
  if (!Array.isArray(d.characters) && !Array.isArray(d.themes) && !d.format && !d.canvas) return false;
  /* 색 팔레트는 별도 저장소를 쓴다 — 같이 담아 왔으면 그쪽에 되돌려 놓는다 */
  if (Array.isArray(d.palette)) {
    userPalette = d.palette.filter(x => /^#[0-9A-Fa-f]{6}$/.test(x)).map(x => x.toUpperCase());
    savePalette();
  }
  if (d.colors && typeof d.colors === 'object') Object.assign(S.colors, d.colors);
  if (Array.isArray(d.characters)) S.characters = d.characters;
  if (Array.isArray(d.themes) && d.themes.length) {
    S.themes = d.themes;
    S.themes.forEach(ensureThemeFormat);
    S.activeThemeId = d.themes.some(t => t.id === d.activeThemeId) ? d.activeThemeId : d.themes[0].id;
  }
  if (d.format && typeof d.format === 'object') Object.assign(S.format, d.format);
  if (d.canvas && typeof d.canvas === 'object') Object.assign(S.canvas, d.canvas);
  /* 들여온 캐릭터가 사라진 발화자를 가리키지 않게 정리한다 */
  const ids = new Set(S.characters.map(c => c.id));
  S.blocks.forEach(b => { if (b.speakerId && !ids.has(b.speakerId)) b.speakerId = null; });
  S.ui.editingCharacterId = null; S.ui.charDraft = null; S.ui.editingThemeId = null; S.ui.themeDraft = null;
  return true;
}

$('#settingsPick').onchange = e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let ok = false;
    try { ok = applySettings(JSON.parse(r.result)); } catch (_) { ok = false; }
    if (!ok) { toast('이 도구에서 내보낸 설정 파일이 아닙니다'); return; }
    save(); render();
    toast(`설정을 들여왔습니다 · 캐릭터 ${S.characters.length} · 테마 ${S.themes.length}`);
  };
  r.readAsText(f);
};

/* 새로 꽂을 것(사진·서명)을 고르는 상태로 들어간다.
   setStage 는 '자리를 옮기면 하던 것을 접는다' 는 뜻이라 이 값을 지운다 —
   그러니 자리를 먼저 옮기고 나서 세워야 한다. 순서를 바꾸면 세우자마자 지워진다. */
function startNew(kind, src) {
  setStage('format');
  S.ui.newKind = kind;
  S.ui.newSrc = src || '';
  S.ui.navOpen = true;        /* NAV 안의 일이다 — [×] 로 돌아올 길을 남긴다 */
  render();
}

/* [+] 가 앉을 자리는 화면 폭에 따라 다르다 — 좁으면 작성창 옆, 넓으면 도구 네비 오른쪽 끝.
   같은 버튼을 옮겨 붙인다(두 개를 두면 상태를 두 번 맞춰야 하고 반드시 어긋난다). */
/* 묶음의 마지막 칸 — 지금 콘텐츠를 확정하는 단추 하나.
   무엇을 하고 있든 자리는 늘 여기다. 이름과 하는 일만 갈린다. */
let _confirm = null;          /* 사진 편집기가 자기 확정 동작을 여기 걸어 둔다 */
function renderFoot() {
  const foot = $('#sheetFoot');
  foot.innerHTML = '';
  const b = selBlock();
  const img = S.ui.newKind === 'image' || (b && b.type === 'image');
  let label, act, on = true;
  if (img) {
    label = S.ui.newKind ? '이미지 넣기' : '자른 대로 적용';
    act = () => { if (_confirm) _confirm(); };
    on = !!_confirm;
  } else if (b && b.type === 'footer') {
    /* 서명은 적는 대로 반영된다 — 여기서는 '다 썼다' 만 알려 주면 된다 */
    label = '확인'; act = () => setStage('composer');
  } else {
    label = '↑ 캔버스에 올리기';
    act = () => commit();
    on = $('#ta').value.trim().length > 0;
  }
  const btn = el('button', 'btn btn-primary', label);
  btn.disabled = !on;
  btn.onclick = act;
  foot.appendChild(btn);
  foot.hidden = false;
  const compact = $('#compactSubmit');
  if (compact) compact.disabled = !$('#ta').value.trim();
}

/* ── 렌더 ────────────────────────────────────────────────── */
function render() {
  renderCanvas();
  renderTools();
  renderFormat();
  renderComposer();
  renderInsertBar();
  renderFoot();
  renderBulkBar();
  $('#sheet').classList.toggle('is-format', S.ui.stage === 'format');
  $('#sheet').classList.toggle('is-tools', S.ui.stage === 'tools');
  $('#sheet').classList.toggle('is-min', !!S.ui.min);
  $('#sheet').classList.toggle('is-compact', !S.ui.min && S.ui.panel === 'compact');
  $('#sheet').classList.toggle('is-full', !S.ui.min && S.ui.panel === 'full');
  requestAnimationFrame(measureSheet);
}

let suppressBlockTapUntil = 0;
/* ═══════════════════════════════════════════════════════════════
   [원본 initBlockInteractions]
   짧게 탭 = 수정 · 420ms 꾹 = 그 자리에서 끌어 순서 이동.
   길게 누르기 전에 손가락이 움직이면 화면 스크롤로 넘겨준다.
   ═══════════════════════════════════════════════════════════════ */
(function initBlockInteractions() {
  const cv = $('#canvas');
  const LONG_MS = 420, MOVE_TOL = 8;
  let st = null, timer = null;

  const clearMarks = () => cv.querySelectorAll('.drop-before,.drop-after')
    .forEach(r => r.classList.remove('drop-before', 'drop-after'));

  function reset() {
    clearTimeout(timer); timer = null;
    if (st) st.row.classList.remove('dragging');
    document.body.style.userSelect = ''; cv.style.userSelect = '';
    clearMarks(); st = null;
  }

  cv.addEventListener('pointerdown', e => {
    if (e.button != null && e.button !== 0) return;
    if (e.target.closest('button,a,input,select,textarea')) return;
    const row = e.target.closest('.blk'); if (!row) return;
    /* 선택 삭제 모드에서는 탭이 곧 선택 토글이다 — 끌기·수정은 쉰다 [원본] */
    if (S.ui.bulk) {
      e.preventDefault();
      const id = row.dataset.id;
      S.ui.picked = S.ui.picked || new Set();
      S.ui.picked.has(id) ? S.ui.picked.delete(id) : S.ui.picked.add(id);
      render();
      return;
    }
    reset();
    /* 여기서 기본 동작을 막지 않으면 브라우저가 글자 선택 드래그를 먼저 시작한다. [원본] */
    e.preventDefault();
    cv.style.userSelect = 'none';
    /* 마우스에는 길게 누르기를 요구하지 않는다. 손가락은 끌기와 화면 스크롤이 겹쳐서
       420ms 를 눌러야 하지만, 마우스로 그러면 그냥 끌었을 때 아무 일도 안 일어나
       기능이 없는 것처럼 보인다. [원본은 둘 다 길게 누르기였다] */
    const mouse = !e.pointerType || e.pointerType === 'mouse';
    st = { id: row.dataset.id, row, x: e.clientX, y: e.clientY, pid: e.pointerId, mouse, long: false, moved: false, target: null, pos: null };
    timer = setTimeout(beginDrag, LONG_MS);
  });

  function beginDrag() {
    if (!st || st.long) return;
    st.long = true;
    st.row.classList.add('dragging');
    document.body.style.userSelect = 'none';
    try { const s = window.getSelection(); if (s && s.removeAllRanges) s.removeAllRanges(); } catch (_) { }
    try { cv.setPointerCapture(st.pid); } catch (_) { }
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (_) { }
  }

  cv.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.pid) return;
    if (!st.long) {
      if (Math.hypot(e.clientX - st.x, e.clientY - st.y) <= MOVE_TOL) return;
      /* 마우스는 움직인 순간이 곧 끌기 시작. 손가락이면 스크롤 의도로 보고 넘긴다. */
      if (!st.mouse) { reset(); return; }
      clearTimeout(timer); timer = null;
      beginDrag();
    }
    st.moved = true; clearMarks(); st.target = null;
    const rows = pageRows().filter(r => r !== st.row);
    let best = null, bd = Infinity;
    rows.forEach(r => {
      const rc = r.getBoundingClientRect(), mid = rc.top + rc.height / 2;
      const d = Math.abs(e.clientY - mid);
      if (d < bd) { bd = d; best = { r, before: e.clientY < mid }; }
    });
    if (best) {
      best.r.classList.add(best.before ? 'drop-before' : 'drop-after');
      st.target = best.r; st.pos = best.before ? 'before' : 'after';
    }
  });

  function finish(e) {
    if (!st || (e && e.pointerId != null && e.pointerId !== st.pid)) return;
    if (performance.now() < suppressBlockTapUntil) { reset(); return; }
    const s = st;
    clearTimeout(timer); timer = null; st = null;
    clearMarks();
    s.row.classList.remove('dragging');
    document.body.style.userSelect = ''; cv.style.userSelect = '';

    if (!s.long) {                       /* 짧은 탭 — 수정 */
      const b = S.blocks.find(x => x.id === s.id); if (!b) return;
      /* 이미 고른 블록을 다시 누르면 놓는다 — 고르는 동작과 같은 손짓으로 풀 수 있어야 한다 */
      if (S.ui.selectedBlockId === b.id) { setStage('composer'); return; }
      S.ui.selectedBlockId = b.id;
      $('#ta').value = HAS_TEXT.includes(b.type) ? (b.text || '') : '';
      setStage('format'); autoGrow();
      if (HAS_TEXT.includes(b.type) && window.matchMedia('(pointer:fine)').matches) focusComposerEnd();
      return;
    }
    if (!s.moved || !s.target) return;

    const tid = s.target.dataset.id;
    const from = S.blocks.findIndex(m => m.id === s.id);
    let to = S.blocks.findIndex(m => m.id === tid);
    if (from < 0 || to < 0) return;
    if (s.pos === 'after') to++;
    if (to > from) to--;
    if (to === from) return;
    const it = S.blocks.splice(from, 1)[0];
    S.blocks.splice(to, 0, it);
    save(); render(); toast('순서를 옮겼습니다');
  }
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', reset);
  /* 끌기가 시작된 뒤에는 손가락을 움직여도 화면이 따라 스크롤되지 않게 막는다.
     passive:false 여야 preventDefault 가 먹는다. [원본] */
  cv.addEventListener('touchmove', e => { if (st && st.long) e.preventDefault(); }, { passive: false });
})();

/* ═══════════════════════════════════════════════════════════════
   미리보기 끌어 옮기기
   캔버스가 화면보다 길어지면 아래쪽이 시트에 가려 안 보인다. 스크롤로 닿기는 하지만
   미리보기 안에는 잡을 것이 없어 '움직이지 않는 화면' 처럼 읽혔다 —
   빈 자리를 잡아 끌 수 있게 한다.
   · 블록 위에서 시작한 끌기는 순서 이동이므로 건드리지 않는다
   · 손가락은 원래 쓸어서 스크롤되므로 마우스에서만 켠다 (겹치면 두 배로 밀린다)
   ═══════════════════════════════════════════════════════════════ */
(function initStagePan() {
  const stage = $('#stage');
  let s = null;

  stage.addEventListener('pointerdown', e => {
    if (e.pointerType && e.pointerType !== 'mouse') return;
    if (e.button != null && e.button !== 0) return;
    if (e.target.closest('.blk')) return;
    if (e.target.closest('button,a,input,select,textarea')) return;
    s = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop, pid: e.pointerId, on: false };
  });
  stage.addEventListener('pointermove', e => {
    if (!s || e.pointerId !== s.pid) return;
    const dx = e.clientX - s.x, dy = e.clientY - s.y;
    if (!s.on) {
      if (Math.hypot(dx, dy) < 4) return;          /* 그냥 누른 것과 끈 것을 가른다 */
      s.on = true;
      stage.classList.add('is-pan');
      try { stage.setPointerCapture(s.pid); } catch (_) { }
    }
    stage.scrollLeft = s.l - dx;
    stage.scrollTop = s.t - dy;
  });
  const end = e => {
    if (!s || (e && e.pointerId != null && e.pointerId !== s.pid)) return;
    stage.classList.remove('is-pan');
    s = null;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
})();

/* 미리보기 배율은 저장 규격과 분리한다. 버튼·트랙패드·두 손가락 모두 이 값만 바꾼다. */
(function initPreviewZoom() {
  const stage = $('#stage');
  const setZoom = value => {
    S.ui.previewZoom = clamp(value, PREVIEW_ZOOMS[0], PREVIEW_ZOOMS[PREVIEW_ZOOMS.length - 1]);
    fitCanvas();
  };
  const step = direction => {
    const cur = Number(S.ui.previewZoom) || 1;
    let i = PREVIEW_ZOOMS.findIndex(v => v >= cur - .001);
    if (i < 0) i = PREVIEW_ZOOMS.length - 1;
    setZoom(PREVIEW_ZOOMS[clamp(i + direction, 0, PREVIEW_ZOOMS.length - 1)]);
  };
  $('#zoomOut').onclick = () => step(-1);
  $('#zoomIn').onclick = () => step(1);
  $('#zoomReset').onclick = () => setZoom(1);

  stage.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setZoom((Number(S.ui.previewZoom) || 1) * Math.exp(-e.deltaY * .002));
  }, { passive: false });

  let pinch = null;
  const metric = touches => {
    const a = touches[0], b = touches[1];
    return { d: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY), x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
  };
  stage.addEventListener('touchstart', e => {
    if (e.touches.length !== 2) return;
    suppressBlockTapUntil = performance.now() + 500;
    const m = metric(e.touches);
    pinch = { d: Math.max(1, m.d), x: m.x, y: m.y, zoom: Number(S.ui.previewZoom) || 1, left: stage.scrollLeft, top: stage.scrollTop };
    e.preventDefault();
  }, { passive: false, capture: true });
  stage.addEventListener('touchmove', e => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    suppressBlockTapUntil = performance.now() + 500;
    const m = metric(e.touches);
    setZoom(pinch.zoom * m.d / pinch.d);
    stage.scrollLeft = pinch.left - (m.x - pinch.x);
    stage.scrollTop = pinch.top - (m.y - pinch.y);
  }, { passive: false, capture: true });
  const end = e => { if (!e.touches || e.touches.length < 2) pinch = null; };
  stage.addEventListener('touchend', end, { capture: true });
  stage.addEventListener('touchcancel', end, { capture: true });
})();

/* ── 이벤트 ──────────────────────────────────────────────── */
$('#ta').addEventListener('input', () => {
  /* 다 지워도 브라우저가 <br> 을 남겨 :empty 가 풀린다 — placeholder 가 안 보인다 */
  const ed = $('#ta');
  if (!ed.textContent.trim() && !ed.querySelector('img')) ed.innerHTML = '';
  autoGrow(); trackSel();
  const b = selBlock();
  if (b) { b.text = $('#ta').value; save(); renderCanvas(); }   /* 편집은 실시간 반영 */
  renderComposer();
  /* 확정 단추는 '올릴 글이 있는가' 로 켜지고 꺼진다 — 글자를 칠 때마다 다시 재야 한다.
     이걸 빼먹어 HTML 을 다 적어도 올리기가 비활성인 채로 남아 있었다. */
  renderFoot();
});
$('#ta').addEventListener('focus', () => {
  if (!isWide()) {
    $('#sheet').classList.add('is-normal-writing');
    requestAnimationFrame(measureSheet);
  }
});
$('#ta').addEventListener('blur', () => {
  $('#sheet').classList.remove('is-normal-writing'); requestAnimationFrame(measureSheet);
});
let _selSig = '';
function selectionSig() {
  const ta = $('#ta'), sel = window.getSelection();
  if (!sel || !sel.rangeCount) return 'none';
  const r = sel.getRangeAt(0);
  if (!ta.contains(r.commonAncestorContainer)) return 'outside';
  return `${r.startOffset}:${r.endOffset}:${r.collapsed ? 1 : 0}:${ta.textContent.length}`;
}
function onSelChange() {
  trackSel();
  const sig = selectionSig();
  if (sig === _selSig) return;          /* 선택이 그대로면 다시 그리지 않는다 */
  _selSig = sig;
  if (S.ui.stage === 'format') renderFormat();
}
['select', 'mouseup', 'touchend', 'keyup'].forEach(ev => $('#ta').addEventListener(ev, onSelChange));
document.addEventListener('selectionchange', trackSel);
$('#ta').addEventListener('keydown', e => {
  /* 그냥 Enter 는 줄바꿈이다 — 블록은 빈 줄로 나누므로 Enter 를 전송으로 쓰면 여러 줄을 못 쓴다.
     ⌘/Ctrl + Enter 를 '올리기' 로 둔다. 편집 중이면 편집을 끝낸다. */
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); commit(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#saveSheet').classList.contains('is-on')) closeSaveSheet();
    else if ($('#modalRoot').firstChild) closeModal();
    else if ($('#popRoot').firstChild) closePop();
    else if (S.ui.stage !== 'composer') setStage('composer');
  }
});

/* 작성 묶음을 손 안 댄 처음 상태로 되돌린다 — NAV 닫고, 꽂던 것 놓고, 고르던 블록 놓고.
   한 번에 끝나는 동작(가로선·이미지 확정·선택 삭제)이 끝나면 여기로 온다. */
function backToDefault() {
  S.ui.navOpen = false;
  S.ui.newKind = null; S.ui.newSrc = ''; S.ui.insertMode = null;
  S.ui.panel = 'compact';
  setStage('composer');
}

/* NAV 단추 — 닫혀 있으면 열고, 열려 있으면 닫으면서 콘텐츠를 기본으로 되돌린다.
   '기본으로' 가 핵심이다. 사진을 꽂다 말았든 블록을 고치던 중이든 이 하나로 빠져나온다. */
NAV_BTN.onclick = () => {

  S.ui.navOpen = true;
  S.ui.panel = 'compact';
  render();
};
$('#btnSave').onclick = () => exportPNG();
$('#btnExport').onclick = () => exportSettings();
$('#btnImport').onclick = () => $('#settingsPick').click();
$('#btnReset').onclick = () => {
  const ok = window.confirm('작성한 글·이미지·캐릭터·테마·서식·캔버스 설정을 모두 지울까요?\n이 작업은 되돌릴 수 없습니다.');

  else setStage('tools');
};
$('#btnGearInTabs').onclick = () => { S.ui.panel = 'compact'; setStage('composer'); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  S.ui.tool = t.dataset.tool;
  S.ui.editingCharacterId = null; S.ui.charDraft = null;
  S.ui.editingThemeId = null; S.ui.themeDraft = null;
  /* 도구로 넘어가면 아래쪽(작성)은 처음 상태로 되돌린다 — 고르던 블록도, 꽂던 것도,
     열어 둔 삽입 메뉴도 놓는다. 넓은 화면에서는 둘이 함께 보이므로, 안 놓으면
     '지금 무엇을 고치는 중인가' 가 두 곳으로 갈려 손이 헷갈린다. */
  S.ui.selectedBlockId = null; S.ui.newKind = null; S.ui.newSrc = '';
  S.ui.insertMode = null;
  endEdit();
  render();
});

/* 그립 — 위로 = 크게 · 아래로 = 작게 [원본 mSheetHandle 규칙] */
(() => {
  const grip = $('#grip');
  /* 서식(슬라이드업)은 손잡이로 열지 않는다 — 블록을 골랐을 때만 자동으로 열린다.
     그래서 손잡이가 오가는 단계는 셋이다: 접힘 ↔ 작성 ↔ 도구.
     맨 아래 '접힘' 은 시트를 손잡이만 남기고 치워 미리보기를 넓게 보는 자리다. */
  const ORDER = ['min', 'compact', 'full'];
  const STEP = 26;                       /* 한 단계 올라가는 데 필요한 거리 */
  let y0 = null, base = 1, moved = false, pid = null;

  const go = i => {
    const st = ORDER[clamp(i, 0, ORDER.length - 1)];
    if (st === 'min') {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      if (!S.ui.min) { S.ui.min = true; render(); }
      return;
    }
    /* 도구 시트에서 compact로 내릴 때 높이만 바꾸면 .is-tools의 60dvh가 계속 이긴다.
       도구 단계도 함께 닫아야 내용과 패널이 한 번에 입력 상태로 돌아간다. */
    if (st === 'compact' && S.ui.stage === 'tools') {
      S.ui.panel = 'compact';
      setStage('composer');
      return;
    }
    const wasMin = S.ui.min;
    const changed = wasMin || S.ui.panel !== st;
    S.ui.min = false;
    S.ui.panel = st;
    if (changed) render();
  };

  grip.addEventListener('pointerdown', e => {
    /* 서식 단계는 ORDER 에 없다(-1). 작성 단계로 쳐서, 아래로 끌면 편집부터 닫히게 한다. */
    y0 = e.clientY; moved = false; pid = e.pointerId;
    base = S.ui.min ? 0 : Math.max(1, ORDER.indexOf(S.ui.panel));
    try { grip.setPointerCapture(e.pointerId); } catch (_) { }
  });
  /* 끄는 도중에 바로 단계가 바뀐다 — 떼야 반응하면 안 먹은 것처럼 느껴진다 */
  grip.addEventListener('pointermove', e => {
    if (y0 == null || e.pointerId !== pid) return;
    e.preventDefault();
    const d = y0 - e.clientY;
    if (Math.abs(d) > 6) moved = true;
    go(base + Math.round(d / STEP));
  });
  const end = e => {
    if (y0 == null || (e && e.pointerId !== pid)) return;
    const d = y0 - e.clientY; y0 = null; pid = null;
    /* 탭 = 한 단계 열기. 접혀 있으면 작성으로, 작성이면 도구로, 도구면 도로 작성으로. */
    if (!moved) go(S.ui.min ? 1 : S.ui.panel === 'compact' ? 2 : 1);
    else go(base + Math.round(d / STEP));
  };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('touchmove', e => { if (y0 != null) e.preventDefault(); }, { passive: false });
})();

let _rz;
window.addEventListener('resize', () => {
  autoGrow(); measureSheet(); closePop();
  fitCanvas();                       /* 남는 폭이 달라지면 축소율도 달라진다 */
  clearTimeout(_rz);
  _rz = setTimeout(() => { if (!isFit()) render(); else renderPageMarks(); }, 120);
});

loadPalette();
initComposer();
load();
S.themes.forEach(ensureThemeFormat); /* 기존 전역 서식을 각 테마에 한 번 복사하는 호환 마이그레이션 */
save();
ensureFontCss(fmt().font);
syncViewportVars();
render();
autoGrow();
</script>
</body>
</html>
